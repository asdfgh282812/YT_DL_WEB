<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片下載網頁系統</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
            },
            animation: {
              'stripes': 'progress-bar-stripes 1s linear infinite',
            }
          }
        }
      }
    </script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }

        body {
            background-color: #0f172a; /* bg-slate-900 */
            background-image:
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.25) 0px, transparent 50%);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        .glass-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* Select element styling for dark mode */
        select option, select optgroup {
            background-color: #1e293b;
            color: #f1f5f9;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .progress-bar-striped {
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }

        @keyframes progress-bar-stripes {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }

        /* Vue Transitions */
        .slide-up-enter-active, .slide-up-leave-active {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide-up-enter-from, .slide-up-leave-to {
            opacity: 0;
            transform: translateY(20px);
        }

        .list-enter-active, .list-leave-active {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .list-enter-from {
            opacity: 0;
            transform: translateX(30px);
        }
        .list-leave-to {
            opacity: 0;
            transform: translateX(-30px);
        }
        .list-leave-active {
            position: absolute;
            width: 100%;
        }
        .list-move {
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .toast-slide-enter-active, .toast-slide-leave-active {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast-slide-enter-from, .toast-slide-leave-to {
            opacity: 0;
            transform: translateY(-20px);
        }
        
        .fade-slide-enter-active, .fade-slide-leave-active {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-slide-enter-from, .fade-slide-leave-to {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Interactive Buttons */
        .btn-interactive {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-interactive:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
        }
        .btn-interactive:active:not(:disabled) {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 font-sans antialiased overflow-x-hidden">
    <div id="app" v-cloak class="min-h-screen flex flex-col p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto gap-6">
        
        <!-- Global Toast Notification -->
        <transition name="toast-slide">
            <div v-if="toast.show" 
                 class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-full flex items-center gap-3 backdrop-blur-md shadow-2xl border transition-all"
                 :class="toast.type === 'success' ? 'bg-emerald-500/90 border-emerald-400/50 text-white' : 'bg-rose-500/90 border-rose-400/50 text-white'">
                
                <svg v-if="toast.type === 'success'" class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <svg v-else class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                
                <span class="font-medium whitespace-nowrap">{{ toast.message }}</span>
                <button @click="toast.show = false" class="ml-2 hover:opacity-75 transition-opacity">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </transition>

        <!-- Auth Overlay -->
        <div v-if="!isAuthenticated" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="glass-panel p-8 rounded-2xl w-full max-w-sm border-t border-white/20">
                <h2 class="text-2xl font-bold mb-6 text-center text-white flex items-center justify-center gap-2">
                    <svg class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    系統登入
                </h2>
                <input v-model="tokenInput" @keyup.enter="login" type="password" placeholder="請輸入 AUTH_TOKEN" class="w-full glass-input rounded-xl p-3 mb-6 transition-all">
                <button @click="login" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] text-white font-medium py-3 rounded-xl btn-interactive flex items-center justify-center gap-2">
                    <span>登入系統</span>
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
                <p v-if="authError" class="text-rose-400 mt-4 text-center text-sm bg-rose-500/10 p-2 rounded-lg border border-rose-500/20">{{ authError }}</p>
            </div>
        </div>

        <template v-else>
            <!-- Header -->
            <header class="glass-panel p-5 px-6 rounded-2xl flex justify-between items-center shrink-0 border-t border-white/20">
                <div class="flex items-center gap-3">
                    <img src="/favicon.svg" alt="App Icon" class="w-10 h-10 shadow-lg rounded-xl">
                    <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">影片下載系統</h1>
                </div>
                <div class="flex gap-3">
                    <button @click="openSettings" class="glass-panel hover:bg-white/10 text-slate-200 px-4 py-2 rounded-xl btn-interactive flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span class="hidden sm:inline">設定</span>
                    </button>
                    <button @click="logout" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-4 py-2 rounded-xl btn-interactive flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        <span class="hidden sm:inline">登出</span>
                    </button>
                </div>
            </header>

            <!-- Main Layout: Two Columns -->
            <div class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">

                <!-- Left Column: Input & Parse Results -->
                <div class="lg:w-[45%] flex flex-col gap-6 relative z-10">

                    <!-- Main Input Area -->
                    <div class="glass-panel p-6 rounded-2xl border-t border-white/20">
                        <label class="block text-sm font-medium text-slate-300 mb-3 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                            影片連結
                        </label>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <input v-model="url" @keyup.enter="parseUrl" type="text" placeholder="請輸入影片網址 (YouTube, Bilibili等)..." class="flex-1 glass-input rounded-xl p-3 transition-all placeholder-slate-500">
                            <button @click="parseUrl" :disabled="isParsing || !url" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-400 disabled:shadow-none hover:shadow-[0_0_15px_rgba(79,70,229,0.4)] text-white px-6 py-3 rounded-xl btn-interactive whitespace-nowrap font-medium flex items-center justify-center gap-2">
                                <template v-if="isParsing">
                                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    解析中...
                                </template>
                                <template v-else>
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                    解析網址
                                </template>
                            </button>
                        </div>
                    </div>

                    <!-- Parse Results -->
                    <transition name="slide-up">
                        <div v-if="parseResult" class="glass-panel p-6 rounded-2xl border-t border-white/20 bg-gradient-to-b from-white/5 to-transparent">
                            <template v-if="parseResult.is_playlist">
                                <div class="flex items-start gap-4 mb-5 pb-5 border-b border-white/10">
                                    <div class="bg-white/10 p-3 rounded-xl shrink-0">
                                        <svg class="w-8 h-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-bold text-lg text-white truncate leading-tight pt-1" :title="parseResult.title">{{ parseResult.title }}</h3>

                                        <div class="flex flex-wrap justify-between items-center mt-2 gap-3">
                                            <label class="flex items-center gap-2 cursor-pointer group relative">
                                                <input type="checkbox" v-model="selectAll" class="peer hidden">
                                                <div class="w-5 h-5 rounded flex items-center justify-center transition-all duration-300
                                                            bg-white/5 border border-white/20
                                                            peer-checked:bg-gradient-to-br peer-checked:from-indigo-500 peer-checked:to-purple-500 peer-checked:border-indigo-400/50 shadow-sm">
                                                    <svg class="w-3.5 h-3.5 text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                                </div>
                                                <span class="text-sm text-indigo-300 group-hover:text-indigo-200 transition-colors">全選 (共 {{ parseResult.item_count }} 首)</span>
                                            </label>
                                            <div class="relative">
                                                <div @click="toggleBatchDropdown" class="glass-input rounded-lg px-3 py-1.5 text-sm cursor-pointer border border-white/20 bg-slate-800/80 hover:bg-slate-700/80 transition-colors flex items-center justify-between gap-2 min-w-[160px]">
                                                    <span class="font-medium">{{ batchDownloadFormat === 'video' ? '🎬 最高畫質 (MP4)' : '🎵 純音訊 (MP3)' }}</span>
                                                    <svg class="w-4 h-4 text-slate-400 transition-transform duration-300" :class="{ 'rotate-180': isBatchDropdownOpen }" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                                </div>
                                                <transition name="fade-slide">
                                                    <ul v-if="isBatchDropdownOpen" class="absolute z-50 right-0 mt-1.5 w-48 bg-slate-800/90 backdrop-blur-xl border border-white/10 shadow-2xl rounded-xl py-1 overflow-hidden">
                                                        <li @click="selectBatchFormat('video')" class="px-4 py-2 text-sm text-slate-200 hover:bg-white/10 hover:text-white cursor-pointer transition-colors flex items-center gap-2" :class="{ 'bg-white/5 text-indigo-300 font-medium': batchDownloadFormat === 'video' }">
                                                            <span class="flex-1">🎬 最高畫質 (MP4)</span>
                                                            <svg v-if="batchDownloadFormat === 'video'" class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                        </li>
                                                        <li @click="selectBatchFormat('audio')" class="px-4 py-2 text-sm text-slate-200 hover:bg-white/10 hover:text-white cursor-pointer transition-colors flex items-center gap-2" :class="{ 'bg-white/5 text-indigo-300 font-medium': batchDownloadFormat === 'audio' }">
                                                            <span class="flex-1">🎵 純音訊 (MP3)</span>
                                                            <svg v-if="batchDownloadFormat === 'audio'" class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                        </li>
                                                    </ul>
                                                </transition>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col gap-4">
                                    <div class="max-h-64 overflow-y-auto glass-input rounded-xl p-2 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent">
                                        <div v-for="(item, index) in parseResult.entries" :key="index"
                                             @click="item.selected = !item.selected"
                                             class="flex items-center gap-3 text-sm text-slate-300 truncate py-2 px-2 border-b border-white/5 last:border-0 hover:bg-white/5 rounded-lg transition-colors cursor-pointer group">
                                            <label class="relative flex items-center shrink-0 cursor-pointer" @click.stop>
                                                <input type="checkbox" v-model="item.selected" class="peer hidden">
                                                <div class="w-4 h-4 rounded flex items-center justify-center transition-all duration-300
                                                            bg-white/5 border border-white/20
                                                            peer-checked:bg-gradient-to-br peer-checked:from-indigo-500 peer-checked:to-purple-500 peer-checked:border-indigo-400/50 shadow-sm">
                                                    <svg class="w-3 h-3 text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                                </div>
                                            </label>
                                            <span class="truncate flex-1 transition-colors" :class="{'text-white font-medium': item.selected, 'text-slate-400 group-hover:text-slate-300': !item.selected}">{{ index + 1 }}. {{ item.title }}</span>
                                        </div>
                                    </div>
                                    <button @click="startBatchDownload" :disabled="selectedCount === 0" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-400 disabled:shadow-none text-white font-medium px-6 py-3 rounded-xl btn-interactive flex items-center justify-center gap-2 mt-2 transition-all">
                                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                        下載選取的 {{ selectedCount }} 首歌曲
                                    </button>
                                </div>
                            </template>
                            <template v-else>
                                <div class="flex items-start gap-4 mb-5 pb-5 border-b border-white/10">
                                    <div class="bg-white/10 p-3 rounded-xl shrink-0">
                                        <svg class="w-8 h-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    </div>
                                    <h3 class="font-bold text-lg text-white truncate leading-tight pt-1" :title="parseResult.title">{{ parseResult.title }}</h3>
                                </div>

                                <div class="flex flex-col gap-4">
                                    <div class="flex-1 relative">
                                        <label class="block text-sm font-medium text-slate-400 mb-2">請選擇下載格式：</label>
                                        <div @click="toggleFormatDropdown" class="w-full glass-input rounded-xl p-3 cursor-pointer hover:border-indigo-500/50 transition-all flex items-center justify-between gap-2 group">
                                            <span class="font-medium text-slate-200 group-hover:text-white transition-colors">{{ getFormatText }}</span>
                                            <svg class="w-5 h-5 text-slate-400 group-hover:text-indigo-400 transition-all duration-300" :class="{ 'rotate-180 text-indigo-400': isFormatDropdownOpen }" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                        </div>
                                        
                                        <transition name="fade-slide">
                                            <ul v-if="isFormatDropdownOpen" class="absolute z-50 left-0 right-0 mt-2 bg-slate-800/90 backdrop-blur-xl border border-white/10 shadow-2xl rounded-xl py-2 max-h-60 overflow-y-auto custom-scrollbar">
                                                <li @click="selectFormat('audio_only')" class="px-4 py-2.5 text-sm text-slate-200 hover:bg-white/10 hover:text-white cursor-pointer transition-colors flex items-center gap-2 border-b border-white/5 pb-3 mb-1" :class="{ 'bg-white/5 text-indigo-300 font-medium': selectedFormat === 'audio_only' }">
                                                    <span class="flex-1">🎵 純音訊 (MP3)</span>
                                                    <svg v-if="selectedFormat === 'audio_only'" class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                </li>
                                                <li class="px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider select-none">
                                                    🎬 影片畫質 (MP4)
                                                </li>
                                                <li v-for="fmt in parseResult.video_formats" :key="fmt.id" 
                                                    @click="selectFormat(fmt.id)" 
                                                    class="px-4 py-2.5 text-sm text-slate-300 hover:bg-white/10 hover:text-white cursor-pointer transition-colors flex items-center gap-2"
                                                    :class="{ 'bg-white/5 text-indigo-300 font-medium': selectedFormat === fmt.id }">
                                                    <span class="flex-1">{{ fmt.resolution }} ({{ fmt.ext }})</span>
                                                    <svg v-if="selectedFormat === fmt.id" class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                </li>
                                            </ul>
                                        </transition>
                                    </div>
                                    <button @click="startDownload" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] text-white font-medium px-6 py-3 rounded-xl btn-interactive flex items-center justify-center gap-2 mt-2">
                                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                        加入下載佇列
                                    </button>
                                </div>
                            </template>
                        </div>
                    </transition>

                    <!-- Batch Download Messages -->
                    <transition name="slide-up">
                        <div v-if="batchDownloadMsg" class="mt-4 p-4 rounded-xl border flex items-center gap-3 backdrop-blur-md" :class="batchDownloadSuccess ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'">
                            <svg v-if="batchDownloadSuccess" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            <svg v-else class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            <span class="font-medium text-sm">{{ batchDownloadMsg }}</span>
                        </div>
                    </transition>
                </div>

                <!-- Right Column: Task List -->
                <div class="lg:w-[55%] glass-panel p-6 rounded-2xl flex flex-col lg:h-[calc(100vh-160px)] min-h-[500px] border-t border-white/20 relative z-10">

                    <div class="flex justify-between items-center mb-6 shrink-0 pb-4 border-b border-white/10">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <svg class="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                            下載任務 ({{ tasks.length }})
                        </h2>
                        <div class="text-sm bg-white/5 px-3 py-1.5 rounded-lg border border-white/10 flex items-center gap-2">
                            <span class="relative flex h-2.5 w-2.5">
                              <span v-if="wsConnected" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5" :class="wsConnected ? 'bg-emerald-500' : 'bg-rose-500'"></span>
                            </span>
                            <span :class="{'text-emerald-400 font-medium': wsConnected, 'text-rose-400': !wsConnected}">
                                {{ wsConnected ? '系統已連線' : '連線中斷' }}
                            </span>
                        </div>
                    </div>

                    <!-- Scrolling Area -->
                    <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 relative overflow-x-hidden">

                        <div v-if="tasks.length === 0" class="flex flex-col items-center justify-center h-full text-slate-400/60 pb-10">
                            <svg class="w-20 h-20 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                            <p class="text-lg">目前沒有任何下載任務</p>
                        </div>

                        <!-- Transition Group wrapper must have pos-relative for smooth absolute positioning during leave -->
                        <div class="relative w-full pb-4">
                            <transition-group name="list" tag="div" class="flex flex-col gap-4">
                                <div v-for="task in reversedTasks" :key="task.task_id" class="glass-panel p-5 rounded-xl border border-white/10 hover:bg-white/10 transition-colors w-full box-border">
                                    <div class="flex justify-between items-start mb-3 gap-4">
                                        <div class="flex-1 min-w-0">
                                            <h4 class="font-semibold text-slate-100 truncate mb-1" :title="task.title">{{ task.title }}</h4>
                                            <div class="text-xs text-slate-400 flex flex-wrap gap-2 items-center">
                                                <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-medium border border-indigo-500/30">
                                                    {{ task.is_audio_only ? 'MP3' : 'MP4' }}
                                                </span>
                                                <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10">狀態: {{ getStatusText(task.state) }}</span>
                                                <span v-if="task.state === 'DOWNLOADING'" class="text-blue-300">速度: {{ task.speed || '計算中...' }}</span>
                                                <span v-if="task.state === 'DOWNLOADING'" class="text-blue-300">剩餘: {{ task.eta || '--' }}</span>
                                            </div>
                                        </div>
                                        <div class="flex gap-2 shrink-0">
                                            <button v-if="task.state === 'COMPLETED'" @click="downloadFile(task)" title="下載至電腦" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 p-2 rounded-lg btn-interactive">
                                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                                            </button>
                                            <button @click="deleteTask(task.task_id)" title="刪除任務" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 p-2 rounded-lg btn-interactive">
                                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Progress Bar -->
                                    <div class="w-full bg-slate-800/80 rounded-full h-3 mt-4 overflow-hidden border border-slate-700/50 shadow-inner">
                                        <div class="h-full rounded-full transition-all duration-500"
                                             :class="getProgressBarClass(task.state)"
                                             :style="`width: ${task.state === 'COMPLETED' ? 100 : task.progress}%`">
                                        </div>
                                    </div>
                                    <div v-if="task.state === 'ERROR'" class="text-sm text-rose-400 mt-2 bg-rose-500/10 p-2 rounded border border-rose-500/20">
                                        {{ task.error_msg }}
                                    </div>
                                </div>
                            </transition-group>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Modal -->
            <transition name="slide-up">
                <div v-if="showSettings" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div class="glass-panel p-6 sm:p-8 rounded-2xl w-full max-w-md border-t border-white/20 shadow-2xl relative">
                        <button @click="showSettings = false" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>

                        <h2 class="text-xl font-bold mb-6 text-white flex items-center gap-2">
                            <svg class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            系統設定
                        </h2>

                        <div class="mb-6">
                            <label class="block text-sm font-medium text-slate-300 mb-2">最大同時下載數</label>
                            <input v-model.number="tempConfig.max_concurrent_downloads" type="number" min="1" max="10" class="w-full glass-input rounded-xl p-3">
                        </div>

                        <div class="mb-6 border-t border-white/10 pt-6">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="text-sm font-bold text-slate-200">Cookie 管理</h3>
                                <span class="text-xs font-mono px-2 py-1 rounded-md border" :class="cookieStatus ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' : 'text-amber-400 border-amber-500/30 bg-amber-500/10'">
                                    狀態: {{ cookieStatus ? '已載入' : '未提供' }}
                                </span>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="file" accept=".txt" ref="cookieFileInput" @change="handleCookieFileChange" class="text-sm text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-500/20 file:text-indigo-300 hover:file:bg-indigo-500/30 file:transition-colors flex-1 min-w-0 glass-input rounded-xl focus:outline-none cursor-pointer p-1.5" />
                                <button @click="uploadCookie" :disabled="isUploadingCookie || !cookieFile" class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-400 text-white px-4 py-2 rounded-xl transition-all whitespace-nowrap flex-shrink-0 font-medium btn-interactive">
                                    <span v-if="isUploadingCookie">上傳中...</span>
                                    <span v-else>上傳</span>
                                </button>
                            </div>
                            <transition name="slide-up">
                                <p v-if="cookieMsg" class="text-sm mt-3 p-2 rounded-lg border" :class="cookieMsgSuccess ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'">{{ cookieMsg }}</p>
                            </transition>
                        </div>

                        <div class="mb-8 border-t border-white/10 pt-6">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="text-sm font-bold text-slate-200">系統維護</h3>
                                <span class="text-xs font-mono text-blue-300 bg-blue-500/10 border border-blue-500/30 px-2 py-1 rounded-md">目前版本: {{ ytdlpVersion }}</span>
                            </div>

                            <button @click="updateYtDlp" :disabled="isUpdating" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white py-3 rounded-xl btn-interactive flex justify-center items-center gap-2 font-medium">
                                <template v-if="isUpdating">
                                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    更新中...請稍候
                                </template>
                                <template v-else>
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                    一鍵更新 yt-dlp
                                </template>
                            </button>
                            <transition name="slide-up">
                                <p v-if="updateMsg" class="text-sm mt-3 p-2 rounded-lg border" :class="updateSuccess ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'">{{ updateMsg }}</p>
                            </transition>
                        </div>

                        <div class="flex justify-end gap-3 border-t border-white/10 pt-6">
                            <button @click="showSettings = false" class="px-5 py-2.5 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 btn-interactive font-medium">取消</button>
                            <button @click="saveSettings" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl shadow-lg hover:shadow-[0_0_15px_rgba(79,70,229,0.4)] btn-interactive font-medium">儲存設定</button>
                        </div>
                    </div>
                </div>
            </transition>

        </template>
            <transition name="slide-up">
    <div v-if="confirmModal.show" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center z-[100] p-4">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-sm border-t border-white/20 shadow-2xl text-center">
            <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">確認刪除？</h3>
            <p class="text-slate-400 mb-8 leading-relaxed">{{ confirmModal.message }}</p>
            <div class="flex gap-3">
                <button @click="confirmModal.show = false" class="flex-1 px-5 py-3 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 btn-interactive font-medium">
                    取消
                </button>
                <button @click="handleConfirm" class="flex-1 px-5 py-3 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white rounded-xl shadow-lg hover:shadow-[0_0_20px_rgba(225,29,72,0.4)] btn-interactive font-medium">
                    確定刪除
                </button>
            </div>
        </div>
    </div>
    </transition>
    <transition name="slide-up">
                <div v-if="isRestarting" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center z-[200] p-4">
                    <div class="glass-panel p-8 rounded-2xl w-full max-w-sm border-t border-white/20 text-center shadow-2xl relative overflow-hidden">
                        
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
                        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>

                        <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                            <svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </div>
                        
                        <h2 class="text-2xl font-bold text-white mb-3 tracking-wide">系統重啟中</h2>
                        <p class="text-slate-300 mb-8 leading-relaxed">
                            yt-dlp 更新完畢，後端正在重新載入。<br>
                            網頁將於 <span class="text-blue-400 font-bold text-2xl mx-1">{{ restartCountdown }}</span> 秒後自動重新整理。
                        </p>
                        
                        <button @click="forceReload" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3.5 rounded-xl btn-interactive flex items-center justify-center gap-2 shadow-lg hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] transition-all">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            立刻重新整理
                        </button>
                    </div>
                </div>
            </transition>
    
    </div>

    <script src="app.js"></script>

</body>
</html>
