<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>通用媒體下載工具</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* ==========================================================
           Design tokens
           ========================================================== */
        :root {
            color-scheme: light dark;

            --bg: #ffffff;
            --surface: #ffffff;
            --fill: #f5f5f7;
            --fill-hover: #ebebef;
            --label: #1d1d1f;
            --label-2: #6e6e73;
            --label-3: #8e8e93;
            --sep: rgba(0, 0, 0, 0.1);

            --accent: #0071e3;          /* text, links, focus */
            --accent-fill: #0071e3;     /* filled buttons */
            --accent-fill-hover: #0066cc;
            --red-fill: #d70015;
            --placeholder: #737378;
            --chip: #efeff2;
            --green: #248a3d;
            --red: #d70015;
            --orange: #b25000;

            --tint-accent: color-mix(in srgb, var(--accent) 11%, transparent);
            --tint-green: color-mix(in srgb, var(--green) 12%, transparent);
            --tint-red: color-mix(in srgb, var(--red) 10%, transparent);
            --tint-orange: color-mix(in srgb, var(--orange) 12%, transparent);

            --material: rgba(245, 245, 247, 0.72);
            --material-thick: rgba(255, 255, 255, 0.82);
            --scrim: rgba(0, 0, 0, 0.3);
            --shadow-lift: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04), 0 12px 28px rgba(0, 0, 0, 0.07), 0 40px 80px rgba(0, 0, 0, 0.08);
            --shadow-chip: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 16px rgba(0, 0, 0, 0.05);
            --glass: rgba(255, 255, 255, 0.72);
            --glass-edge: inset 0 0.5px 0 rgba(255, 255, 255, 0.95), inset 0 0 0 0.5px rgba(255, 255, 255, 0.55);
            --ambient: none;
            --shadow-float: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 20px 60px rgba(0, 0, 0, 0.22);

            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;

            /* Easing. cubic-bezier fallbacks first, then real spring curves
               (damping 1.0 = settle without overshoot, 0.72 = visible bounce). */
            --ease: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-bounce: cubic-bezier(0.34, 1.4, 0.5, 1);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }
        @supports (transition-timing-function: linear(0, 1)) {
            :root {
                --ease: linear(0, 0.048, 0.153, 0.278, 0.403, 0.516, 0.614, 0.697, 0.764, 0.817, 0.86, 0.893, 0.919, 0.939, 0.954, 0.966, 0.974, 0.981, 0.986, 0.989, 0.992, 0.994, 0.996, 0.997, 0.998, 0.998, 1);
                --ease-bounce: linear(0, 0.073, 0.235, 0.424, 0.603, 0.753, 0.867, 0.946, 0.997, 1.025, 1.036, 1.038, 1.034, 1.027, 1.02, 1.013, 1.008, 1.004, 1.001, 1, 0.999, 0.999, 0.999, 0.999, 0.999, 0.999, 1);
            }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --surface: #1c1c1e;
                --fill: #2c2c2e;
                --fill-hover: #3a3a3c;
                --label: #f5f5f7;
                --label-2: #a1a1a6;
                --label-3: #8e8e93;
                --placeholder: #8e8e93;
                --chip: #2c2c2e;
                --sep: rgba(255, 255, 255, 0.13);
                --accent: #2997ff;
                --green: #30d158;
                --red: #ff453a;
                --orange: #ff9f0a;
                --material: rgba(22, 22, 24, 0.72);
                --material-thick: rgba(44, 44, 46, 0.82);
                --scrim: rgba(0, 0, 0, 0.55);
                --shadow-lift: 0 0 0 0.5px rgba(255, 255, 255, 0.1), inset 0 0.5px 0 rgba(255, 255, 255, 0.12), 0 2px 6px rgba(0, 0, 0, 0.5), 0 32px 70px rgba(0, 0, 0, 0.7);
                --shadow-chip: 0 0 0 0.5px rgba(255, 255, 255, 0.08), 0 6px 16px rgba(0, 0, 0, 0.4);
                --glass: rgba(44, 44, 48, 0.58);
                --glass-edge: inset 0 0.5px 0 rgba(255, 255, 255, 0.2), inset 0 0 0 0.5px rgba(255, 255, 255, 0.06);
                --ambient: radial-gradient(60% 40% at 50% 0%, rgba(41, 151, 255, 0.10), transparent 72%);
                --shadow-float: 0 0 0 0.5px rgba(255, 255, 255, 0.14), 0 24px 70px rgba(0, 0, 0, 0.7);
            }
        }

        /* ==========================================================
           Base
           ========================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        [v-cloak] { display: none; }
        html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--label);
            font: 400 16px/1.5 var(--font);
            letter-spacing: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--label) 24%, transparent) transparent; }
        input, textarea, select { caret-color: var(--accent); }
        body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--ambient); pointer-events: none; }
        h1, h2, h3, h4, p { margin: 0; }
        button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
        button { cursor: pointer; border: 0; background: none; padding: 0; }
        button:disabled { cursor: default; }
        ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
        :focus { outline: none; }
        :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
        input:not([type="checkbox"]):not([type="file"]):focus-visible { outline: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        .tnum { font-variant-numeric: tabular-nums; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .ico-lg { width: 28px; height: 28px; stroke-width: 1.5; }
        .ico-sm { width: 16px; height: 16px; stroke-width: 2; }

        .spinner {
            width: 16px; height: 16px; flex: none; border-radius: 50%;
            border: 2px solid currentColor; border-right-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        .spinner-lg { width: 28px; height: 28px; border-width: 3px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ==========================================================
           Navigation  (floating glass capsule, content scrolls beneath)
           ========================================================== */
        .nav { position: sticky; top: 0; z-index: 40; padding: 12px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); pointer-events: none; }
        .nav-inner {
            pointer-events: auto; max-width: 720px; height: 52px; margin: 0 auto; padding: 8px 8px 8px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 999px;
            background: var(--glass);
            -webkit-backdrop-filter: saturate(200%) blur(26px); backdrop-filter: saturate(200%) blur(26px);
            box-shadow: var(--glass-edge), var(--shadow-chip);
            transition: box-shadow 0.5s var(--ease-out);
        }
        [data-scrolled] .nav-inner { box-shadow: var(--glass-edge), var(--shadow-lift); }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
        .app-icon { display: block; width: 100%; height: 100%; clip-path: inset(3.8% round 24.5%); }
        .icon-frame { display: block; flex: none; filter: drop-shadow(0 0 0.5px rgba(0, 0, 0, 0.25)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.16)); }
        .brand-icon { width: 32px; height: 32px; margin-left: -2px; filter: drop-shadow(0 0 0.5px rgba(0, 0, 0, 0.25)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18)); }
        .nav-actions { display: flex; align-items: center; gap: 2px; }
        .nav-btn {
            display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
            border-radius: 980px; font-size: 14px; color: var(--label-2);
            transition: background-color 0.2s, color 0.2s, transform 0.5s var(--ease);
        }
        @media (hover: hover) and (pointer: fine) { .nav-btn:hover { background: color-mix(in srgb, var(--label) 7%, transparent); color: var(--label); } }
        .nav-btn:active { transform: scale(0.95); transition-duration: 0.08s; background: color-mix(in srgb, var(--label) 11%, transparent); }
        @media (max-width: 640px) {
            .nav-btn { width: 38px; padding: 0; justify-content: center; }
            .nav-btn span { display: none; }
        }

        /* ==========================================================
           Layout
           ========================================================== */
        .wrap { max-width: 720px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right)) 120px max(20px, env(safe-area-inset-left)); }
        .hero { text-align: center; padding: clamp(64px, 13vw, 128px) 0 clamp(40px, 7vw, 64px); }
        .hero h1 {
            font-size: clamp(2.75rem, 10vw, 5.25rem); line-height: 1.04; font-weight: 700;
            letter-spacing: -0.04em; text-wrap: balance; animation: rise-blur 1.3s var(--ease) both;
        }
        .hero p {
            margin: 22px auto 0; max-width: 26em; font-size: clamp(1.05rem, 2.7vw, 1.4rem); line-height: 1.45; letter-spacing: -0.005em;
            color: var(--label-2); text-wrap: balance; animation: rise 1.1s var(--ease) 0.14s both;
        }
        @supports (animation-timeline: scroll()) {
            .hero { animation: hero-out linear both; animation-timeline: scroll(root); animation-range: 0 380px; }
            @keyframes hero-out { to { opacity: 0; transform: translateY(-36px) scale(0.965); } }
        }

        .stack { display: flex; flex-direction: column; gap: 40px; }
        .result { padding-top: 32px; border-top: 0.5px solid var(--sep); }
        .caption { font-size: 13px; line-height: 1.5; color: var(--label-2); }
        .caption-pad { padding: 0 16px; }
        .center { text-align: center; }

        /* Entrance: rise + fade, staggered */
        .reveal { animation: rise 1s var(--ease) both; animation-delay: calc(var(--i, 0) * 80ms); }
        @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.985); } to { opacity: 1; transform: none; } }
        @keyframes rise-blur { from { opacity: 0; transform: translateY(18px) scale(0.98); filter: blur(12px); } to { opacity: 1; transform: none; filter: blur(0); } }

        /* ==========================================================
           Buttons
           ========================================================== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 44px; padding: 0 22px; border-radius: 980px;
            font-size: 15px; font-weight: 500; white-space: nowrap; user-select: none;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s, transform 0.5s var(--ease);
        }
        .btn:active:not(:disabled) { transform: scale(0.96); transition-duration: 0.08s; }
        .btn:disabled { opacity: 0.4; }
        .btn-sm { height: 34px; padding: 0 16px; font-size: 14px; }
        .btn-block { width: 100%; }
        .btn-primary { background: var(--accent-fill); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-fill-hover); }
        .btn-tinted { background: var(--tint-accent); color: var(--accent); }
        .btn-tinted:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 18%, transparent); }
        .btn-gray { background: var(--fill); color: var(--label); }
        .btn-gray:hover:not(:disabled) { background: var(--fill-hover); }
        .btn-danger { background: var(--tint-red); color: var(--red); }
        .btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--red) 18%, transparent); }
        .btn-icon {
            width: 34px; height: 34px; border-radius: 50%; flex: none;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--fill); color: var(--label-2);
            transition: background-color 0.2s, color 0.2s, transform 0.5s var(--ease), opacity 0.2s;
        }
        .btn-icon:hover:not(:disabled) { background: var(--fill-hover); color: var(--label); }
        .btn-icon:active:not(:disabled) { transform: scale(0.9); transition-duration: 0.08s; }
        .btn-icon:disabled { opacity: 0.35; }
        .btn-icon.is-green { background: var(--tint-green); color: var(--green); }
        .btn-icon.is-red { background: var(--tint-red); color: var(--red); }
        .btn-icon.is-accent { background: var(--tint-accent); color: var(--accent); }
        .link { color: var(--accent); font-size: inherit; border-radius: 4px; }
        .link:hover { text-decoration: underline; text-underline-offset: 3px; }

        /* ==========================================================
           Form controls
           ========================================================== */
        .composer { display: flex; flex-direction: column; align-items: center; gap: 22px; }
        @property --ang { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
        .url-wrap { position: relative; width: 100%; isolation: isolate; }
        .url-field {
            position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 68px; padding: 0 10px 0 24px; border-radius: 999px;
            background: var(--surface); box-shadow: var(--shadow-lift);
            transition: box-shadow 0.45s var(--ease-out);
        }
        .url-field > .ico { color: var(--label-3); }
        .url-field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; font-size: 19px; letter-spacing: -0.01em; }
        .url-field input::placeholder { color: var(--placeholder); }
        .send {
            width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center;
            background: var(--accent-fill); color: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16), 0 3px 8px rgba(0, 0, 0, 0.12);
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s, transform 0.5s var(--ease);
        }
        .send .ico { width: 22px; height: 22px; stroke-width: 2.2; }
        .send:disabled { background: var(--fill); color: var(--label-3); box-shadow: none; }
        .send:active:not(:disabled) { transform: scale(0.9); transition-duration: 0.08s; }
        @media (hover: hover) and (pointer: fine) { .send:hover:not(:disabled) { background: var(--accent-fill-hover); } }
        /* Parsing: a thin light travels around the capsule */
        .url-wrap::before, .url-wrap::after {
            content: ""; position: absolute; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity 0.6s var(--ease-out);
            background: conic-gradient(from var(--ang), transparent 0 52%, #5ac8fa 72%, #0a84ff 88%, transparent 100%);
        }
        .url-wrap::before { inset: -1.5px; z-index: 2; padding: 1.5px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        .url-wrap::after { inset: -2px; z-index: 0; filter: blur(18px); }
        .url-wrap.busy { animation: ang 2.2s linear infinite; }
        .url-wrap.busy::before { opacity: 1; }
        .url-wrap.busy::after { opacity: 0.28; }
        @keyframes ang { to { --ang: 360deg; } }

        .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .chip {
            position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 16px; border-radius: 999px;
            background: var(--chip); font-size: 14px; color: var(--label-2); cursor: pointer;
            transition: background-color 0.2s, transform 0.5s var(--ease);
        }
        @media (hover: hover) and (pointer: fine) { .chip:hover { background: color-mix(in srgb, var(--chip), var(--label) 5%); } }
        .chip:active { transform: scale(0.96); transition-duration: 0.08s; }
        .chip-value { color: var(--accent); font-weight: 500; }
        .chip .ico { width: 14px; height: 14px; color: var(--accent); }
        .menu.menu-chip { left: 0; right: auto; min-width: 200px; transform-origin: top left; }
        .adv { width: 100%; text-align: center; }
        .adv-sum { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--label-2); padding: 4px 8px; border-radius: 8px; transition: color 0.2s; }
        .adv-sum:hover { color: var(--label); }
        .adv .group { text-align: left; margin-top: 12px; }
        .quota { margin-top: -10px; }
        .input {
            width: 100%; height: 44px; padding: 0 14px; border: 0; border-radius: 12px;
            background: var(--fill); transition: box-shadow 0.25s var(--ease-out);
        }
        .input:focus { background: var(--fill-hover); }
        .input::placeholder, .row-input::placeholder { color: var(--placeholder); }

        /* Grouped list (inset) */
        .group { background: var(--fill); border-radius: 14px; overflow: hidden; }
        .row {
            position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;
            min-height: 48px; padding: 10px 16px; width: 100%; text-align: left; font-size: 15px;
        }
        .row + .row::before, details.group > .disclosure-body > .row:first-child::before {
            content: ""; position: absolute; left: 16px; right: 0; top: 0; height: 0.5px; background: var(--sep);
        }
        .row-title { flex: none; }
        .row-sub { display: block; font-size: 12.5px; color: var(--label-2); line-height: 1.35; }
        .row-value { color: var(--label-2); text-align: right; min-width: 0; }
        .row-input {
            flex: 1; min-width: 0; height: 28px; border: 0; background: none; text-align: right; color: var(--label-2);
        }
        .row-input:focus { color: var(--label); }
        .row-tap { transition: background-color 0.15s; }
        .row-tap:hover { background: color-mix(in srgb, var(--label) 4%, transparent); }
        .row-tap:active { background: color-mix(in srgb, var(--label) 9%, transparent); transition-duration: 0.04s; }
        .row-stack { flex-direction: column; align-items: stretch; gap: 8px; }
        .group.has-menu { overflow: visible; }
        .group.has-menu > .row:first-child { border-radius: 14px 14px 0 0; }
        .group.has-menu > .row:last-child { border-radius: 0 0 14px 14px; }
        .group.has-menu > .row:only-child { border-radius: 14px; }
        .group.flat { background: none; border-radius: 0; box-shadow: none; border-top: 0.5px solid var(--sep); }
        .group.flat .row { padding-left: 0; padding-right: 0; border-radius: 0 !important; }
        .group.flat .row + .row::before { left: 0; }
        .group.flat .row-tap:hover, .group.flat .row-tap:active { background: none; }
        .group-surface { background: var(--surface); box-shadow: 0 0 0 0.5px var(--sep) inset; }

        .select-btn { display: inline-flex; align-items: center; gap: 6px; min-width: 0; padding: 4px 0; border-radius: 8px; color: var(--accent); font-size: 15px; text-align: right; }
        .select-btn .ico { width: 14px; height: 14px; }
        .select-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; color: var(--label); cursor: pointer; }
        .select-field .ico { width: 14px; height: 14px; color: var(--label-3); }
        .select-field:disabled { color: var(--label-2); cursor: default; }
        .select-field:disabled .ico { opacity: 0.4; }
        .menu.menu-fixed { position: fixed; top: auto; right: auto; z-index: 80; min-width: 0; max-width: none; }

        /* Disclosure */
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary .chev { transition: transform 0.5s var(--ease); color: var(--label-3); }
        details[open] > summary .chev { transform: rotate(90deg); }
        details[open] > .disclosure-body { animation: fade-in 0.45s var(--ease-out); }
        @keyframes fade-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        /* Round check (selection) */
        .check {
            position: relative; width: 22px; height: 22px; flex: none; border-radius: 50%;
            box-shadow: inset 0 0 0 1.5px var(--label-3);
            display: inline-flex; align-items: center; justify-content: center; color: #fff;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .check .ico { width: 13px; height: 13px; stroke-width: 3; transform: scale(0.3); opacity: 0; transition: transform 0.45s var(--ease-bounce), opacity 0.15s; }
        input:checked + .check { background: var(--accent-fill); box-shadow: none; }
        input:checked + .check .ico { transform: none; opacity: 1; }
        input:focus-visible + .check { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
        .check-row { cursor: pointer; }

        /* Switch */
        .switch {
            appearance: none; -webkit-appearance: none; flex: none; position: relative; cursor: pointer;
            width: 51px; height: 31px; border-radius: 999px; margin: 0;
            background: color-mix(in srgb, var(--label-3) 45%, transparent);
            transition: background-color 0.3s;
        }
        .switch::after {
            content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25); transition: transform 0.5s var(--ease-bounce), width 0.2s;
        }
        .switch:checked { background: #34c759; }
        .switch:checked::after { transform: translateX(20px); }
        .switch:active::after { width: 33px; }
        .switch:checked:active::after { transform: translateX(14px); }
        .switch:disabled { opacity: 0.4; cursor: default; }

        input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type="file"] { font-size: 14px; color: var(--label-2); }
        input[type="file"]::file-selector-button {
            margin-right: 12px; height: 32px; padding: 0 14px; border: 0; border-radius: 980px;
            background: var(--tint-accent); color: var(--accent); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
        }

        /* ==========================================================
           Callouts / badges
           ========================================================== */
        .callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
        .callout > .ico { margin-top: 2px; }
        .callout-warn { background: var(--tint-orange); color: var(--orange); }
        .callout-warn .callout-actions { margin-top: 10px; }
        .callout-error { background: var(--tint-red); color: var(--red); }
        .callout-text { color: var(--label); }
        .badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 980px; font-size: 12px; font-weight: 500; background: var(--fill); color: var(--label-2); }
        .badge-green { background: var(--tint-green); color: var(--green); }
        .badge-orange { background: var(--tint-orange); color: var(--orange); }
        .badge-accent { background: var(--tint-accent); color: var(--accent); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; }

        /* ==========================================================
           Parse result
           ========================================================== */
        .media-head { display: flex; align-items: center; gap: 14px; padding: 0 0 20px; }
        .tile { flex: none; display: grid; place-items: center; color: var(--accent); }
        .tile .ico { width: 30px; height: 30px; stroke-width: 1.5; }
        .media-title { font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .media-sub { font-size: 13px; color: var(--label-2); margin-top: 2px; }

        .menu-anchor { position: relative; }
        .menu {
            position: absolute; z-index: 30; right: 0; top: calc(100% + 6px); min-width: 240px; max-width: min(340px, calc(100vw - 40px)); max-height: 320px; overflow-y: auto;
            background: color-mix(in srgb, var(--surface) 93%, transparent); -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px);
            border-radius: 16px; box-shadow: var(--shadow-float); padding: 6px; transform-origin: top right; list-style: none; margin: 0;
            overscroll-behavior: contain;
        }
        .menu-left { left: 0; right: 0; max-width: none; transform-origin: top center; }
        .menu li { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: background-color 0.12s; }
        .menu li:hover { background: color-mix(in srgb, var(--label) 8%, transparent); }
        .menu li:active { background: color-mix(in srgb, var(--label) 14%, transparent); transition-duration: 0.03s; }
        .menu li > span { flex: 1; min-width: 0; }
        .menu li .ico { color: var(--accent); }
        .menu li.selected { font-weight: 600; }
        .menu li.menu-label { cursor: default; min-height: 30px; font-size: 12px; font-weight: 500; color: var(--label-2); }
        .menu li.menu-label:hover { background: none; }
        .menu hr { border: 0; height: 0.5px; background: var(--sep); margin: 4px 6px; }
        .menu-enter-active { transition: opacity 0.2s var(--ease-out), transform 0.5s var(--ease); }
        .menu-leave-active { transition: opacity 0.14s ease-out, transform 0.18s ease-out; }
        .menu-enter-from, .menu-leave-to { opacity: 0; transform: scale(0.9) translateY(-6px); }

        .entries { max-height: 288px; overflow-y: auto; background: var(--fill); border-radius: 14px; margin-top: 12px; }
        .entry { display: flex; align-items: center; gap: 12px; padding: 11px 16px; font-size: 14.5px; cursor: pointer; position: relative; transition: background-color 0.15s; }
        .entry + .entry::before { content: ""; position: absolute; top: 0; left: 50px; right: 0; height: 0.5px; background: var(--sep); }
        .entry:hover { background: color-mix(in srgb, var(--label) 4%, transparent); }
        .entry .num { color: var(--label-3); width: 2ch; text-align: right; flex: none; }
        .entry .t { flex: 1; min-width: 0; color: var(--label-2); transition: color 0.2s; }
        .entry.on .t { color: var(--label); }

        .result-enter-active { transition: opacity 0.4s var(--ease-out), transform 0.8s var(--ease); }
        .result-leave-active { transition: opacity 0.2s ease-out, transform 0.3s ease-out; }
        .result-enter-from { opacity: 0; transform: translateY(24px) scale(0.97); }
        .result-leave-to { opacity: 0; transform: translateY(-8px) scale(0.98); }

        /* ==========================================================
           Tasks
           ========================================================== */
        .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .section-head h2 { font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
        .section-head h2 small { font-size: 17px; font-weight: 500; color: var(--label-3); margin-left: 6px; letter-spacing: 0; }
        .conn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--label-2); }

        .tasks { position: relative; display: flex; flex-direction: column; }
        .tasks.is-empty { display: none; }
        .task { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px 2px; width: 100%; }
        .task + .task::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 0.5px; background: var(--sep); }
        .task-main { display: flex; align-items: center; gap: 14px; }
        .state-ico { position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label-2); transition: background-color 0.5s, color 0.5s; }
        .state-ico > * { grid-area: 1 / 1; animation: pop 0.6s var(--ease-bounce) both; }
        @keyframes pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
        .st-DOWNLOADING { background: var(--tint-accent); color: var(--accent); }
        .st-PROCESSING { background: var(--tint-orange); color: var(--orange); }
        .st-COMPLETED { background: var(--tint-green); color: var(--green); }
        .st-ERROR { background: var(--tint-red); color: var(--red); }
        .task-info { flex: 1; min-width: 0; }
        .task-title { font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.35; }
        .task-meta { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 13px; color: var(--label-2); margin-top: 1px; }
        .task-meta .s-DOWNLOADING { color: var(--accent); }
        .task-meta .s-PROCESSING { color: var(--orange); }
        .task-meta .s-COMPLETED { color: var(--green); }
        .task-meta .s-ERROR { color: var(--red); }
        .task-actions { display: flex; gap: 8px; flex: none; }

        .bar { height: 4px; margin-left: 56px; border-radius: 99px; background: var(--fill); overflow: hidden; }
        .bar-fill { position: relative; height: 100%; border-radius: inherit; background: var(--label-3); overflow: hidden; transition: width 0.8s var(--ease), background-color 0.5s; }
        .bar-fill.f-DOWNLOADING { background: var(--accent-fill); }
        .bar-fill.f-PROCESSING { background: var(--orange); }
        .bar-fill.f-PROCESSING::after {
            content: ""; position: absolute; inset: 0; transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent); animation: sweep 1.8s var(--ease-out) infinite;
        }
        @keyframes sweep { to { transform: translateX(100%); } }
        .task-error { margin-left: 56px; font-size: 14px; line-height: 1.5; color: var(--red); word-break: break-word; }
        .task-error .btn { margin-top: 10px; }
        .task-error .hint { margin-top: 6px; color: var(--label-2); font-size: 12.5px; }

        .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 48px 20px 24px; color: var(--label-2); }
        .empty .ico { width: 44px; height: 44px; stroke-width: 1.2; color: var(--label-3); margin-bottom: 8px; }
        .empty b { font-size: 19px; font-weight: 600; color: var(--label); letter-spacing: -0.01em; }
        .empty span { font-size: 14px; }

        .list-enter-active { transition: opacity 0.4s var(--ease-out), transform 0.8s var(--ease); }
        .list-leave-active { transition: opacity 0.25s ease-out, transform 0.35s ease-out; position: absolute; left: 0; right: 0; }
        .list-move { transition: transform 0.7s var(--ease); }
        .list-enter-from { opacity: 0; transform: translateY(-16px) scale(0.96); }
        .list-leave-to { opacity: 0; transform: scale(0.94); }

        /* ==========================================================
           Overlays — sheets, alert, toast
           ========================================================== */
        .overlay {
            position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            background: var(--scrim); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            transition: opacity 0.35s var(--ease-out), background-color 0.35s, -webkit-backdrop-filter 0.35s, backdrop-filter 0.35s;
        }
        .overlay-top { z-index: 100; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
        .sheet {
            position: relative; width: 100%; max-width: 560px; max-height: min(88vh, 860px); display: flex; flex-direction: column;
            background: var(--surface); border-radius: 28px; box-shadow: var(--shadow-float); overflow: hidden;
            transition: transform 0.7s var(--ease), opacity 0.3s var(--ease-out);
        }
        .sheet-lg { max-width: 760px; }
        .sheet-head {
            position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none;
            padding: 18px 20px 14px 24px; background: var(--material-thick);
            -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
        }
        .sheet-head h2 { font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
        .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 24px 24px; display: flex; flex-direction: column; gap: 24px; }
        .sheet-foot { flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -0.5px 0 var(--sep); background: var(--material-thick); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); }
        .sheet-section > h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--label-2); padding: 0 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .sheet-section > .caption { padding: 8px 16px 0; }
        .form-grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
        @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        .field > span { display: block; font-size: 13px; color: var(--label-2); padding: 0 4px 6px; }
        .user-card { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 0.5px var(--sep) inset; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        .user-card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
        .actions-inline { display: flex; flex-wrap: wrap; gap: 8px; }

        .sheet-enter-from, .sheet-leave-to { opacity: 0; }
        .sheet-enter-from .sheet { transform: scale(0.92) translateY(12px); opacity: 0; }
        .sheet-leave-to .sheet { transform: scale(0.96); opacity: 0; transition-duration: 0.22s; }
        .sheet-leave-active { transition-duration: 0.25s; }
        @media (max-width: 640px) {
            .overlay { align-items: flex-end; padding: 0; }
            .overlay-center { align-items: center; padding: 20px; }
            .sheet:not(.alert) { max-width: none; max-height: 92vh; border-radius: 28px 28px 0 0; }
            .sheet-enter-from .sheet:not(.alert) { transform: translateY(100%); opacity: 1; }
            .sheet-leave-to .sheet:not(.alert) { transform: translateY(100%); opacity: 1; }
            .sheet-body, .sheet-foot { padding-left: 16px; padding-right: 16px; }
            .sheet-head { padding-left: 20px; padding-right: 14px; }
        }

        /* Confirmation card */
        .alert { width: 380px; max-width: 100%; text-align: center; border-radius: 28px; background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
        .alert-body { padding: 34px 28px 4px; }
        .alert-icon { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: var(--tint-red); color: var(--red); }
        .alert-icon .ico { width: 26px; height: 26px; stroke-width: 1.6; }
        .alert-body h3 { font-size: 21px; font-weight: 600; line-height: 1.25; letter-spacing: -0.015em; }
        .alert-body p { margin-top: 8px; font-size: 15px; line-height: 1.55; color: var(--label-2); text-wrap: balance; }
        .alert-actions { display: flex; flex-direction: column; gap: 10px; padding: 26px 28px 28px; }
        .alert-actions .btn { height: 50px; font-size: 16px; }

        .alert-center { text-align: center; }
        .alert-enter-from .alert { transform: scale(0.94) translateY(10px); }

        .alert-enter-from, .alert-leave-to { opacity: 0; }

        .alert-leave-active { transition-duration: 0.2s; }

        .restart-count { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; color: var(--accent); margin: 14px 0 4px; }

        /* Toast — a capsule that grows out of the top edge */
        .toast {

            transform-origin: top center;

        .toast-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #30d158; color: #000; }
        .toast-ico .ico { width: 16px; height: 16px; stroke-width: 2.6; }
        .toast.is-error .toast-ico { background: #ff453a; color: #fff; }
        .toast-msg { font-size: 14.5px; font-weight: 500; line-height: 1.35; padding: 3px 4px 3px 0; min-width: 0; word-break: break-word; }
        .toast-x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; color: rgba(255, 255, 255, 0.55); transition: background-color 0.15s, color 0.15s; }
        .toast-x:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .toast-enter-active { transition: opacity 0.25s var(--ease-out), transform 0.7s var(--ease-bounce); }
        .toast-leave-active { transition: opacity 0.2s ease-in, transform 0.3s ease-in; }
        .toast-enter-from { opacity: 0; transform: translateY(-24px) scale(0.55); }
        .toast-leave-to { opacity: 0; transform: translateY(-14px) scale(0.8); }

        /* ==========================================================
           Sign in
           ========================================================== */
        .auth { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
        .auth-inner { width: 100%; max-width: 340px; text-align: center; animation: rise 1s var(--ease) both; }
        .auth-icon { width: 104px; height: 104px; margin: 0 auto 22px; display: block; animation: rise 1s var(--ease) both; }
        .auth h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
        .auth .sub { margin: 8px 0 28px; color: var(--label-2); font-size: 15px; }
        .auth form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .auth .group { background: var(--surface); box-shadow: 0 0 0 0.5px var(--sep) inset; }
        .auth .group { padding: 6px 0; }
        .auth .group .row { min-height: 48px; padding: 0 16px; }
        .auth .group input { flex: 1; min-width: 0; border: 0; background: none; height: 48px; font-size: 16px; }
        .auth .group input::placeholder { color: var(--placeholder); }
        .auth .btn { height: 50px; font-size: 16px; }
        .auth-alt { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
        .auth-alt details summary { text-align: center; font-size: 14px; color: var(--accent); padding: 6px; }
        .auth-alt details .disclosure-body { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
        .auth-error { margin-top: 18px; font-size: 14px; color: var(--red); animation: shake 0.5s var(--ease-out); }
        @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

        /* ==========================================================
           Accessibility & preferences
           ========================================================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.12s !important; scroll-behavior: auto !important; }

            .sheet-enter-from .sheet, .sheet-leave-to .sheet, .alert-enter-from .alert, .alert-leave-to .alert,
            .menu-enter-from, .menu-leave-to, .toast-enter-from, .toast-leave-to,
            .list-enter-from, .list-leave-to, .result-enter-from, .result-leave-to { transform: none !important; }
            .bar-fill::after, .url-wrap::before, .url-wrap::after { display: none; }

        @media (prefers-reduced-transparency: reduce) {
            :root { --material: var(--bg); --material-thick: var(--surface); }
            .nav-inner, .chip, .sheet-head, .sheet-foot, .menu, .alert, .overlay { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

        @media (prefers-contrast: more) {

        @supports not (backdrop-filter: blur(1px)) and (not (-webkit-backdrop-filter: blur(1px))) {
            :root { --material: var(--bg); --material-thick: var(--surface); }
        }
    </style>
</head>
