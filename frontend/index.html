<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用媒體下載工具</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
            },
            animation: {
              'stripes': 'progress-bar-stripes 1s linear infinite',
            }
          }
        }
      }
    </script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }

        body {
            background-color: #0f172a; /* bg-slate-900 */
            background-image:
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.25) 0px, transparent 50%);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        .glass-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* Select element styling for dark mode */
        select option, select optgroup {
            background-color: #1e293b;
            color: #f1f5f9;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .progress-bar-striped {
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }

        @keyframes progress-bar-stripes {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }

        /* Vue Transitions */
        .slide-up-enter-active, .slide-up-leave-active {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide-up-enter-from, .slide-up-leave-to {
            opacity: 0;
            transform: translateY(20px);
        }

        .list-enter-active, .list-leave-active {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .list-enter-from {
            opacity: 0;
            transform: translateX(30px);
        }
        .list-leave-to {
            opacity: 0;
            transform: translateX(-30px);
        }
        .list-leave-active {
            position: absolute;
            width: 100%;
        }
        .list-move {
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .toast-slide-enter-active, .toast-slide-leave-active {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast-slide-enter-from, .toast-slide-leave-to {
            opacity: 0;
            transform: translateY(-20px);
        }
        
        .fade-slide-enter-active, .fade-slide-leave-active {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-slide-enter-from, .fade-slide-leave-to {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Interactive Buttons */
        .btn-interactive {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-interactive:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
        }
        .btn-interactive:active:not(:disabled) {
            transform: scale(0.96);
        }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen text-slate-200 font-sans antialiased overflow-x-hidden">
    <div id="app" v-cloak class="min-h-screen flex flex-col p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto gap-6">
        
        <!-- Global Toast Notification -->
        <transition name="toast-slide">
            <div v-if="toast.show" 
                 class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[100] w-max max-w-[calc(100vw-2rem)] px-6 py-3 rounded-2xl flex items-center gap-3 backdrop-blur-md shadow-2xl border transition-all"
                 :class="toast.type === 'success' ? 'bg-emerald-500/90 border-emerald-400/50 text-white' : 'bg-rose-500/90 border-rose-400/50 text-white'">
                
                <svg v-if="toast.type === 'success'" class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <svg v-else class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                
                <span class="font-medium break-words min-w-0">{{ toast.message }}</span>
                <button @click="toast.show = false" class="ml-2 hover:opacity-75 transition-opacity">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </transition>

        <!-- Auth Overlay -->
        <div v-if="!isAuthenticated" class="fixed overflow-y-auto inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="glass-panel p-8 rounded-2xl w-full max-w-sm border-t border-white/20">
                <h2 class="text-2xl font-bold mb-6 text-center text-white flex items-center justify-center gap-2">
                    <svg class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    系統登入
                </h2>
                <form v-if="authConfig.password_enabled !== false" @submit.prevent="login('password')" class="space-y-3 mb-5">
                    <label class="block text-sm text-slate-300">帳號
                        <input v-model="usernameInput" autocomplete="username" required class="w-full mt-2 glass-input rounded-xl p-3" placeholder="管理者提供的帳號">
                    </label>
                    <label class="block text-sm text-slate-300">密碼
                        <input v-model="passwordInput" type="password" autocomplete="current-password" required class="w-full mt-2 glass-input rounded-xl p-3" placeholder="請輸入密碼">
                    </label>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl">帳號登入</button>
                </form>
                <details v-if="authConfig.token_enabled" class="mb-4">
                    <summary class="text-sm text-indigo-300 cursor-pointer mb-3">管理者 Token 登入</summary>
                <template v-if="authConfig.token_enabled">
                <input v-model="tokenInput" @keyup.enter="login" type="password" placeholder="請輸入 AUTH_TOKEN" class="w-full glass-input rounded-xl p-3 mb-6 transition-all">
                <button @click="login" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] text-white font-medium py-3 rounded-xl btn-interactive flex items-center justify-center gap-2">
                    <span>登入系統</span>
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
                </template>
                </details>
                <button v-if="authConfig.sso_enabled" @click="loginSso" class="w-full mt-4 bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl">
                    使用 {{ authConfig.sso_name }} 登入
                </button>
                <p v-if="authError" class="text-rose-400 mt-4 text-center text-sm bg-rose-500/10 p-2 rounded-lg border border-rose-500/20">{{ authError }}</p>
            </div>
        </div>

        <template v-else>
            <!-- Header -->
            <header class="glass-panel p-5 px-6 rounded-2xl flex flex-wrap gap-3 justify-between items-center shrink-0 border-t border-white/20">
                <div class="flex items-center gap-3">
                    <img src="/favicon.svg" alt="App Icon" class="w-10 h-10 shadow-lg rounded-xl">
                    <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">通用媒體下載</h1>
                </div>
                <div class="flex gap-2 flex-wrap justify-end">
                    <button v-if="isAdmin" @click="openUsers" aria-label="使用者管理" class="glass-panel hover:bg-white/10 text-slate-200 px-3 py-2 rounded-xl text-sm">使用者</button>
                    <button @click="openSites" aria-label="Cookies 設定" class="glass-panel hover:bg-white/10 text-slate-200 px-3 py-2 rounded-xl text-sm">Cookies 設定</button>
                    <button v-if="isAdmin" aria-label="設定" @click="openSettings" class="glass-panel hover:bg-white/10 text-slate-200 px-4 py-2 rounded-xl btn-interactive flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span class="hidden sm:inline">設定</span>
                    </button>
                    <button aria-label="登出" @click="logout" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-4 py-2 rounded-xl btn-interactive flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        <span class="hidden sm:inline">登出</span>
                    </button>
                </div>
            </header>

            <div class="glass-panel rounded-xl px-5 py-3 flex flex-wrap items-center justify-between gap-2 text-sm">
                <span class="text-slate-300">{{ currentUser?.name }} · {{ isAdmin ? '管理者' : '一般使用者' }}</span>
                <span class="text-indigo-300">{{ quotaText }}<span v-if="!isAdmin" class="text-slate-400"> · 已完成 {{ quota.used }} · 預留 {{ quota.reserved }}</span></span>
            </div>

            <!-- Main Layout: Two Columns -->
            <div class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">

                <!-- Left Column: Input & Parse Results -->
                <div class="lg:w-[45%] flex flex-col gap-6 relative z-10">

                    <!-- Main Input Area -->
                    <div class="glass-panel p-6 rounded-2xl border-t border-white/20">
                        <label class="block text-sm font-medium text-slate-300 mb-3 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                            影片連結
                        </label>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <input v-model="url" @keyup.enter="parseUrl" type="text" placeholder="影片網站、m3u8、MPD 或媒體直連…" class="flex-1 glass-input rounded-xl p-3 transition-all placeholder-slate-500">
                            <button @click="parseUrl" :disabled="isParsing || !url" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-400 disabled:shadow-none hover:shadow-[0_0_15px_rgba(79,70,229,0.4)] text-white px-6 py-3 rounded-xl btn-interactive whitespace-nowrap font-medium flex items-center justify-center gap-2">
                                <template v-if="isParsing">
                                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    解析中...
                                </template>
                                <template v-else>
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                    解析網址
                                </template>
                            </button>
                        </div>
                        <div class="flex flex-wrap gap-3 items-center mt-3">
                            <button @click="openSites" class="text-sm px-3 py-2 rounded-lg border border-indigo-400/40 text-indigo-300 hover:bg-indigo-500/10">cookies.txt 使用教學與匯入</button>
                            <p class="text-xs text-slate-400">影片需要登入才能觀看時，請匯入自己瀏覽器匯出的 cookies.txt。</p>
                        </div>
                        <div v-if="loginRequiredUrl && loginRequiredUrl === url.trim()" class="mt-4 p-4 rounded-xl border border-amber-400/30 bg-amber-500/10 space-y-3">
                            <p class="text-sm text-amber-200">來源可能需要登入。請依教學匯入 cookies.txt，再按「解析網址」重試。</p>
                            <button @click="openSites" class="bg-indigo-600 hover:bg-indigo-500 rounded-lg px-4 py-2 text-sm text-white">查看教學並匯入 cookies.txt</button>
                        </div>
                    </div>

                    <div class="glass-panel p-5 rounded-2xl space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <label class="text-sm text-slate-300">影片輸出
                                <select v-model="outputFormat" class="w-full mt-2 glass-input rounded-xl p-3 bg-slate-800">
                                    <option value="mp4">MP4</option><option value="mkv">MKV</option><option value="original">保留原始容器</option>
                                </select>
                            </label>
                            <label class="text-sm text-slate-300">音訊輸出
                                <select v-model="audioFormat" class="w-full mt-2 glass-input rounded-xl p-3 bg-slate-800">
                                    <option value="mp3">MP3</option><option value="m4a">M4A</option>
                                </select>
                            </label>
                        </div>
                        <details>
                            <summary class="text-sm text-indigo-300 cursor-pointer">串流來源進階選項</summary>
                            <div class="space-y-3 mt-3">
                                <label class="block text-sm text-slate-300">來源網頁（Referer）
                                    <input v-model="referer" type="url" placeholder="播放影片的網頁網址，選填" class="w-full mt-2 glass-input rounded-xl p-3">
                                </label>
                                <label class="block text-sm text-slate-300">瀏覽器識別（User-Agent）
                                    <input v-model="userAgent" placeholder="選填" class="w-full mt-2 glass-input rounded-xl p-3">
                                </label>
                                <p class="text-xs text-slate-400">若串流有來源限制，請使用播放頁面的資訊。解析與下載都會套用。</p>
                            </div>
                        </details>
                        <p class="text-xs text-slate-400">支援 yt-dlp 可解析的網站、HLS（m3u8／TS）、DASH（MPD）與媒體直連。MP4／MKV 會重新封裝，遇到編碼不相容可改選 MKV。</p>
                    </div>

                    <!-- Parse Results -->
                    <transition name="slide-up">
                        <div v-if="parseResult" class="glass-panel p-6 rounded-2xl border-t border-white/20 bg-gradient-to-b from-white/5 to-transparent">
                            <p v-if="sourceChanged" class="text-sm text-amber-300 mb-4">來源已變更，請重新解析後再下載。</p>
                            <p v-if="parseResult.warning" class="text-sm text-amber-300 mb-4">{{ parseResult.warning }}</p>
                            <template v-if="parseResult.is_playlist">
                                <div class="flex items-start gap-4 mb-5 pb-5 border-b border-white/10">
                                    <div class="bg-white/10 p-3 rounded-xl shrink-0">
                                        <svg class="w-8 h-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-bold text-lg text-white truncate leading-tight pt-1" :title="parseResult.title">{{ parseResult.title }}</h3>

                                        <div class="flex flex-wrap justify-between items-center mt-2 gap-3">
                                            <label class="flex items-center gap-2 cursor-pointer group relative">
                                                <input type="checkbox" v-model="selectAll" class="peer hidden">
                                                <div class="w-5 h-5 rounded flex items-center justify-center transition-all duration-300
                                                            bg-white/5 border border-white/20
                                                            peer-checked:bg-gradient-to-br peer-checked:from-indigo-500 peer-checked:to-purple-500 peer-checked:border-indigo-400/50 shadow-sm">
                                                    <svg class="w-3.5 h-3.5 text-white opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                                </div>
                                                <span class="text-sm text-indigo-300 group-hover:text-indigo-200 transition-colors">全選 (共 {{ parseResult.item_count }} 首)</span>
                                            </label>
                                            <div class="relative">
                                                <div @click="toggleBatchDropdown" class="glass-input rounded-lg px-3 py-1.5 text-sm cursor-pointer border border-white/20 bg-slate-800/80 hover:bg-slate-700/80 transition-colors flex items-center justify-between gap-2 min-w-[160px]">
                                                    <span class="font-medium">{{ batchDownloadFormat === 'video' ? '🎬 自動最佳畫質' : '🎵 純音訊' }}</span>
                                                    <svg class="w-4 h-4 text-slate-400 transition-transform duration-300" :class="{ 'rotate-180': isBatchDropdownOpen }" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                                </div>
                                                <transition name="fade-slide">
                                                    <ul v-if="isBatchDropdownOpen" class="absolute z-50 right-0 mt-1.5 w-48 bg-slate-800/90 backdrop-blur-xl border border-white/10 shadow-2xl rounded-xl py-1 overflow-hidden">
                                                        <li @click="selectBatchFormat('video')" class="px-4 py-2 text-sm text-slate-200 hover:bg-white/10 hover:text-white cursor-pointer transition-colors flex items-center gap-2" :class="{ 'bg-white/5 text-indigo-300 font-medium': batchDownloadFormat === 'video' }">
                                                            <span class="flex-1">🎬 自動最佳畫質</span>
                                                            <svg v-if="batchDownloadFormat === 'video'" class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                        </li>
                                                        <li @click="selectBatchFormat('audio')" class="px-4 py-2 text-sm text-slate-200 hover:bg-white/10 hover:text-white cursor-pointer transition-colors flex items-center gap-2" :class="{ 'bg-white/5 text-indigo-300 font-medium': batchDownloadFormat === 'audio' }">
                                                            <span class="flex-1">🎵 純音訊</span>
                                                            <svg v-if="batchDownloadFormat === 'audio'" class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                                        </li>
                                                    </ul>
                                                </transition>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col gap-4">
                                    <div class="max-h-64 overflow-y-auto glass-input rounded-xl p-2 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent">

                            </span>

                        </div>
                    </div>

                    <button @click="downloadAll" :disabled="completedCount === 0" class="w-full mb-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl px-4 py-3 font-medium text-white">一鍵下載 ZIP（{{ completedCount }} 個已完成項目）</button>

                                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>

                                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                            </button>
                                        </div>
                                    </div>

                        </div>

                            <svg class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            系統設定
                        </h2>

                        <div class="mb-6">
                            <label class="block text-sm font-medium text-slate-300 mb-2">最大同時下載數</label>

                        </div>

                            <label class="block text-sm font-medium text-slate-300 mb-2">每部影片的分段連線數（HLS／DASH）</label>

                            <p class="text-xs text-slate-400 mt-2">同時下載數控制影片數量；分段連線數控制單部影片的串流下載。</p>
                        </div>

                            </div>
                            <p class="text-xs text-slate-400 mt-2">目前使用：{{ systemStatus.source === 'browser' ? systemStatus.browser : systemStatus.source === 'none' ? '停用' : '上傳檔案' }}。變更來源需儲存設定。</p>
                            <transition name="slide-up">

                        </div>

                        <div class="flex justify-end gap-3 border-t border-white/10 pt-6">
                            <button @click="showSettings = false" class="px-5 py-2.5 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 btn-interactive font-medium">取消</button>
                            <button @click="saveSettings" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl shadow-lg hover:shadow-[0_0_15px_rgba(79,70,229,0.4)] btn-interactive font-medium">儲存設定</button>
                        </div>
                    </div>
                </div>
            </transition>


            <div v-if="showUserManagement && isAdmin" role="dialog" aria-label="使用者管理" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 p-4 flex items-center justify-center">
                <div class="glass-panel rounded-2xl p-5 sm:p-7 w-full max-w-4xl max-h-[92vh] overflow-y-auto space-y-6">
                    <div class="flex justify-between items-center gap-3">
                        <h2 class="text-xl font-bold">使用者管理</h2>
                        <button @click="showUserManagement = false" aria-label="關閉使用者管理" class="px-3 py-2 text-slate-300">✕</button>
                    </div>
                    <div class="bg-white/5 rounded-xl p-4 space-y-3">
                        <h3 class="font-semibold">每日下載規則</h3>
                        <label class="block text-sm text-slate-300">一般使用者預設每日上限
                            <input v-model.number="userPolicy.default_daily_limit" type="number" min="0" max="10000" class="w-full mt-2 glass-input p-3 rounded-xl">
                        </label>
                        <p class="text-xs text-slate-400">管理者不限部數。個人可覆寫預設值；0 代表不允許新增下載。額度按成功完成的影片計算，排隊先預留、失敗歸還，每天台灣時間 00:00 重置。</p>
                        <button @click="savePolicy" :disabled="userBusy" class="bg-indigo-600 hover:bg-indigo-500 rounded-lg px-4 py-2 text-sm">儲存預設上限</button>
                    </div>
                    <form @submit.prevent="createUser" class="bg-white/5 rounded-xl p-4 space-y-4">
                        <h3 class="font-semibold">新增使用者</h3>
                        <div class="grid sm:grid-cols-2 gap-3">
                            <label class="text-sm text-slate-300">新帳號<input v-model="newUser.username" required minlength="3" maxlength="64" autocomplete="off" class="w-full mt-2 glass-input p-3 rounded-xl" placeholder="英文、數字、. _ @ -"></label>
                            <label class="text-sm text-slate-300">顯示名稱<input v-model="newUser.name" required maxlength="80" class="w-full mt-2 glass-input p-3 rounded-xl"></label>
                            <label class="text-sm text-slate-300">初始密碼<input v-model="newUser.password" type="password" required minlength="10" maxlength="256" autocomplete="new-password" class="w-full mt-2 glass-input p-3 rounded-xl" placeholder="至少 10 個字元"></label>
                            <label class="text-sm text-slate-300">角色<select v-model="newUser.role" class="w-full mt-2 glass-input p-3 rounded-xl bg-slate-800"><option value="user">一般使用者</option><option value="admin">管理者（不限部數）</option></select></label>
                        </div>
                        <div v-if="newUser.role === 'user'" class="space-y-3">
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" v-model="newUser.inherit">使用全體預設每日上限</label>
                            <label v-if="!newUser.inherit" class="block text-sm">個人每日上限<input v-model.number="newUser.daily_limit" type="number" min="0" max="10000" class="w-full mt-2 glass-input p-3 rounded-xl"></label>
                        </div>
                        <button type="submit" :disabled="userBusy" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm">新增帳號</button>
                    </form>
                    <div class="space-y-4">
                        <h3 class="font-semibold">帳號與個別設定</h3>
                        <div v-for="user in managedUsers" :key="user.id" :data-user-id="user.id" class="border border-white/10 rounded-xl p-4 space-y-3">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <span class="font-semibold break-all">{{ user.username }} <span class="text-xs text-slate-400">{{ user.oidc_sub ? 'SSO' : user.id === 'bootstrap-admin' ? '系統管理者' : '本機帳號' }}</span></span>
                                <span class="text-xs text-slate-400">今日完成 {{ user.quota.used }} · 預留 {{ user.quota.reserved }} · {{ user.quota.limit === null ? '不限' : `上限 ${user.quota.limit}` }}</span>
                            </div>
                            <div class="grid sm:grid-cols-2 gap-3">
                                <label class="text-sm text-slate-300">名稱<input v-model="user.name" class="w-full mt-2 glass-input p-3 rounded-xl"></label>
                                <label class="text-sm text-slate-300">角色<select v-model="user.role" :disabled="user.id === 'bootstrap-admin'" class="w-full mt-2 glass-input p-3 rounded-xl bg-slate-800"><option value="user">一般使用者</option><option value="admin">管理者（不限部數）</option></select></label>
                                <label v-if="!user.oidc_sub" class="text-sm text-slate-300">重設密碼<input v-model="user.newPassword" type="password" minlength="10" autocomplete="new-password" placeholder="留空保留密碼" class="w-full mt-2 glass-input p-3 rounded-xl"></label>
                                <div v-if="user.role === 'user'" class="text-sm space-y-2">
                                    <label class="flex items-center gap-2"><input type="checkbox" v-model="user.inherit">使用全體預設每日上限</label>
                                    <label v-if="!user.inherit" class="block">個人每日上限<input v-model.number="user.limitInput" type="number" min="0" max="10000" class="w-full mt-2 glass-input p-3 rounded-xl"></label>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center justify-between gap-3">
                                <label class="flex items-center gap-2 text-sm text-slate-300"><input type="checkbox" v-model="user.disabled" :disabled="user.id === 'bootstrap-admin'">停用此帳號</label>
                                <button @click="saveUser(user)" :disabled="userBusy" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm">儲存使用者</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div v-if="showSites" role="dialog" aria-modal="true" aria-label="Cookies 設定" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 p-4 flex items-center justify-center">
                <div class="glass-panel rounded-2xl p-5 sm:p-7 w-full max-w-xl max-h-[92vh] overflow-y-auto space-y-5">
                    <div class="flex items-center justify-between gap-3"><h2 class="font-bold text-xl">Cookies 設定</h2><button @click="showSites = false" aria-label="關閉 Cookies 設定" class="px-3 py-2">✕</button></div>
                    <p class="text-sm text-slate-400">影片需要登入才能觀看時，先在自己的電腦登入網站，再匯入 cookies.txt。匯入資料只供你的帳號使用。</p>
                    <section aria-labelledby="cookie-guide-title" class="rounded-xl border border-indigo-400/25 bg-indigo-500/5 p-4 space-y-3">
                        <h3 id="cookie-guide-title" class="font-semibold">cookies.txt 使用教學</h3>
                        <a href="https://chromewebstore.google.com/detail/get-cookiestxt-locally/cclelndahbckbenkjhflpdbgdldlbecc" target="_blank" rel="noopener noreferrer" class="inline-flex text-sm text-indigo-300 underline underline-offset-4 break-words">安裝 Get cookies.txt LOCALLY ↗</a>
                        <ol class="list-decimal pl-5 space-y-2 text-sm text-slate-300 leading-relaxed">
                            <li>在電腦的 Chrome 開啟上方連結，按「加到 Chrome」，安裝擴充套件。</li>
                            <li>開啟要下載的網站（例如 YouTube），登入自己的帳號，確認影片可以播放。</li>
                            <li>保持在該網站分頁，點 Chrome 右上角的擴充功能圖示，開啟 Get cookies.txt LOCALLY。將 Export Format 設為 <strong class="text-white">Netscape</strong>，按 <strong class="text-white">Export</strong> 或 Export As，儲存 .txt 檔案。</li>
                            <li>回到這裡選取檔案，按「匯入個人 cookies」。成功後關閉此視窗，重新按「解析網址」，或在失敗任務按「重試」。</li>
                        </ol>
                        <p class="text-xs text-slate-400">只需匯出要下載網站的 cookies；請選 Netscape 格式，檔案上限 2 MB。登入失效時，重新登入網站、匯出並匯入即可。</p>
                    </section>
                    <div class="space-y-3">
                        <h3 class="font-semibold text-sm">匯入 cookies.txt</h3>
                        <input type="file" accept=".txt" ref="cookieFileInput" @change="handleCookieFileChange" aria-label="個人 cookies 檔案" class="w-full text-sm glass-input rounded-xl p-3">
                        <button @click="uploadCookie" :disabled="isUploadingCookie || !cookieFile" class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-400 px-4 py-2 rounded-lg text-sm">{{ isUploadingCookie ? '匯入中…' : '匯入個人 cookies' }}</button>
                        <p v-if="cookieMsg" role="status" class="text-sm break-words" :class="cookieMsgSuccess ? 'text-emerald-300' : 'text-rose-300'">{{ cookieMsg }}</p>
                        <p class="text-xs text-slate-400">新檔案會取代上一份個人匯入檔案。cookies 包含登入憑證，請妥善保管並只上傳至你信任的下載工具。</p>
                    </div>
                    <div class="border-t border-white/10 pt-4 space-y-3">
                        <h3 class="font-semibold text-sm">已儲存的 cookies</h3>
                        <div v-if="siteAccounts.length" class="space-y-3">
                            <div v-for="site in siteAccounts" :key="site.site_key" class="border border-white/10 p-3 rounded-xl flex justify-between items-center gap-3">
                                <span class="break-all text-sm">{{ site.name }}<span class="block text-xs text-slate-400">僅供自己的帳號使用</span></span>
                                <button @click="forgetSite(site)" class="text-sm text-rose-300 px-3 py-2 border border-rose-400/30 rounded-lg shrink-0">移除</button>
                            </div>
                        </div>
                        <p v-else class="text-sm text-slate-400">尚未匯入個人 cookies。</p>
                    </div>
                </div>
            </div>
        </template>
            <transition name="slide-up">
    <div v-if="confirmModal.show" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center z-[100] p-4">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-sm border-t border-white/20 shadow-2xl text-center">
            <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">確認刪除？</h3>
            <p class="text-slate-400 mb-8 leading-relaxed">{{ confirmModal.message }}</p>
            <div class="flex gap-3">
                <button @click="confirmModal.show = false" class="flex-1 px-5 py-3 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 btn-interactive font-medium">
                    取消
                </button>
                <button @click="handleConfirm" class="flex-1 px-5 py-3 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white rounded-xl shadow-lg hover:shadow-[0_0_20px_rgba(225,29,72,0.4)] btn-interactive font-medium">
                    確定刪除
                </button>
            </div>
        </div>
    </div>
    </transition>
    <transition name="slide-up">
                <div v-if="isRestarting" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center z-[200] p-4">
                    <div class="glass-panel p-8 rounded-2xl w-full max-w-sm border-t border-white/20 text-center shadow-2xl relative overflow-hidden">
                        
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
                        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>

                        <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                            <svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </div>
                        
                        <h2 class="text-2xl font-bold text-white mb-3 tracking-wide">系統重啟中</h2>
                        <p class="text-slate-300 mb-8 leading-relaxed">
                            yt-dlp 更新完畢，後端正在重新載入。<br>
                            網頁將於 <span class="text-blue-400 font-bold text-2xl mx-1">{{ restartCountdown }}</span> 秒後自動重新整理。
                        </p>
                        
                        <button @click="forceReload" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3.5 rounded-xl btn-interactive flex items-center justify-center gap-2 shadow-lg hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] transition-all">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            立刻重新整理
                        </button>
                    </div>
                </div>
            </transition>
    
    </div>

    <script src="app.js"></script>

</body>
</html>
