        <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.8" cy="18" r="2.2"/><circle cx="16.8" cy="16" r="2.2"/></symbol>
        <symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h9.5M4 17.5h6M16.5 14.2v6l5-3z"/></symbol>
        <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.2l9 15.8H3zM12 10v4.2M12 17h.01"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
        <symbol id="i-exclaim" viewBox="0 0 24 24"><path d="M12 6.5v7M12 17.5h.01"/></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M8 16l8.5-8.5M9 7.5h7.5V15"/></symbol>
        <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 7.5h16v3H4zM5.5 10.5V18a1.5 1.5 0 001.5 1.5h10a1.5 1.5 0 001.5-1.5v-7.5M10 14h4"/></symbol>
    </svg>

    <div id="app" v-cloak>

        <!-- Toast -->
        <transition name="toast">
            <div v-if="toast.show" class="toast" :class="{ 'is-error': toast.type !== 'success' }" role="status" aria-live="polite">
                <span class="toast-ico">
                    <svg v-if="toast.type === 'success'" class="ico"><use href="#i-check"></use></svg>
                    <svg v-else class="ico"><use href="#i-exclaim"></use></svg>
                </span>
                <span class="toast-msg">{{ toast.message }}</span>
                <button class="toast-x" @click="toast.show = false" aria-label="關閉通知"><svg class="ico ico-sm"><use href="#i-x"></use></svg></button>
            </div>
        </transition>

        <!-- Sign in -->
        <main v-if="!isAuthenticated" class="auth">
            <div class="auth-inner">
                <span class="icon-frame auth-icon"><img src="/favicon.svg?v=2" alt="" class="app-icon"></span>
                <h1>登入</h1>
                <p class="sub">通用媒體下載工具</p>

                <form v-if="authConfig.password_enabled !== false" @submit.prevent="login('password')">
                    <div class="group">
                        <label class="row"><span class="sr-only">帳號</span>
                            <input v-model="usernameInput" autocomplete="username" required placeholder="帳號" autocapitalize="none" spellcheck="false">
                        </label>
                        <label class="row"><span class="sr-only">密碼</span>
                            <input v-model="passwordInput" type="password" autocomplete="current-password" required placeholder="密碼">
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">登入</button>
                </form>

                <div class="auth-alt">
                    <button v-if="authConfig.sso_enabled" @click="loginSso" class="btn btn-gray btn-block">使用 {{ authConfig.sso_name }} 登入</button>
                    <details v-if="authConfig.token_enabled">
                        <summary>使用管理者 Token</summary>
                        <div class="disclosure-body">
                            <div class="group">
                                <label class="row"><span class="sr-only">AUTH_TOKEN</span>
                                    <input v-model="tokenInput" @keyup.enter="login" type="password" placeholder="AUTH_TOKEN" style="flex:1;min-width:0;border:0;background:none;height:48px;font-size:16px">
                                </label>
                            </div>
                            <button @click="login" class="btn btn-primary btn-block">以 Token 登入</button>
                        </div>
                    </details>
                </div>
                <p v-if="authError" class="auth-error" role="alert" :key="authError">{{ authError }}</p>
            </div>
        </main>

        <template v-else>
            <!-- Navigation -->
            <header class="nav">
                <div class="nav-inner">
                    <div class="brand">
                        <span class="icon-frame brand-icon"><img src="/favicon.svg?v=2" alt="" class="app-icon"></span>
                        <span>通用媒體下載</span>
                    </div>
                    <nav class="nav-actions">
                        <button v-if="isAdmin" @click="openUsers" aria-label="使用者管理" class="nav-btn"><svg class="ico"><use href="#i-users"></use></svg><span>使用者</span></button>
                        <button @click="openSites" aria-label="Cookies 設定" class="nav-btn"><svg class="ico"><use href="#i-key"></use></svg><span>Cookies</span></button>
                        <button v-if="isAdmin" @click="openSettings" aria-label="設定" class="nav-btn"><svg class="ico"><use href="#i-gear"></use></svg><span>設定</span></button>
                        <button @click="logout" aria-label="登出" class="nav-btn"><svg class="ico"><use href="#i-logout"></use></svg><span>登出</span></button>
                    </nav>
                </div>
            </header>

            <main class="wrap">
                <section class="hero">
                    <h1>貼上連結，<br>開始下載。</h1>
                    <p>支援影片網站、HLS、DASH 與媒體直連。</p>
                </section>

                <div class="stack">
                    <!-- Composer -->
                    <section class="composer reveal" style="--i:1">
                        <div class="url-wrap" :class="{ busy: isParsing }">
                            <div class="url-field">
                                <svg class="ico"><use href="#i-link"></use></svg>
                                <input v-model="url" @keyup.enter="parseUrl" type="text" inputmode="url" autocapitalize="none" spellcheck="false" aria-label="影片連結" placeholder="影片網站、m3u8、MPD 或媒體直連…">
                                <button @click="parseUrl" :disabled="isParsing || !url" class="send" aria-label="解析網址" title="解析網址">
                                    <span v-if="isParsing" class="spinner"></span>
                                    <svg v-else class="ico"><use href="#i-arrow-up"></use></svg>
                                </button>
                            </div>
                        </div>

                        <div class="chips">
                            <div class="menu-anchor">
                                <button type="button" class="chip" @click="toggleChip('video', $event)" aria-haspopup="menu" :aria-expanded="openChip === 'video'" aria-label="影片輸出格式">
                                    <span>影片</span><span class="chip-value">{{ outputLabels[outputFormat] }}</span><svg class="ico"><use href="#i-updown"></use></svg>
                                </button>
                                <transition name="menu">
                                    <ul v-if="openChip === 'video'" class="menu menu-chip" role="menu" @click.stop>
                                        <li v-for="opt in ['mp4', 'mkv', 'original']" :key="opt" role="menuitem" tabindex="0" @click="outputFormat = opt; closeDropdowns()" @keyup.enter="outputFormat = opt; closeDropdowns()" :class="{ selected: outputFormat === opt }"><span>{{ outputLabels[opt] }}</span><svg v-if="outputFormat === opt" class="ico"><use href="#i-check"></use></svg></li>
                                    </ul>
                                </transition>
                            </div>
                            <div class="menu-anchor">
                                <button type="button" class="chip" @click="toggleChip('audio', $event)" aria-haspopup="menu" :aria-expanded="openChip === 'audio'" aria-label="音訊輸出格式">
                                    <span>音訊</span><span class="chip-value">{{ audioLabels[audioFormat] }}</span><svg class="ico"><use href="#i-updown"></use></svg>
                                </button>
                                <transition name="menu">
                                    <ul v-if="openChip === 'audio'" class="menu menu-chip" role="menu" @click.stop>
                                        <li v-for="opt in ['mp3', 'm4a']" :key="opt" role="menuitem" tabindex="0" @click="audioFormat = opt; closeDropdowns()" @keyup.enter="audioFormat = opt; closeDropdowns()" :class="{ selected: audioFormat === opt }"><span>{{ audioLabels[opt] }}</span><svg v-if="audioFormat === opt" class="ico"><use href="#i-check"></use></svg></li>
                                    </ul>
                                </transition>
                            </div>
                        </div>

                        <p v-if="quota.limit !== null" class="caption center tnum quota">{{ quotaText }} · 已完成 {{ quota.used }} · 預留 {{ quota.reserved }}</p>

                        <details class="adv">
                            <summary class="adv-sum">更多選項<svg class="ico ico-sm chev"><use href="#i-chevron-right"></use></svg></summary>
                            <div class="disclosure-body group">
                                <div class="row"><p class="caption">影片需要登入才能觀看時，請匯入自己瀏覽器匯出的 cookies.txt。<button @click="openSites" class="link">使用教學與匯入</button></p></div>
                                <label class="row"><span class="row-title">來源網頁</span>
                                    <input v-model="referer" type="url" placeholder="Referer，選填" class="row-input" aria-label="來源網頁（Referer）">
                                </label>
                                <label class="row"><span class="row-title">瀏覽器識別</span>
                                    <input v-model="userAgent" placeholder="User-Agent，選填" class="row-input" aria-label="瀏覽器識別（User-Agent）">
                                </label>
                                <div class="row"><p class="caption">若串流有來源限制，請使用播放頁面的資訊，解析與下載都會套用。支援 yt-dlp 可解析的網站、HLS（m3u8／TS）、DASH（MPD）與媒體直連。MP4／MKV 會重新封裝，遇到編碼不相容可改選 MKV。</p></div>
                            </div>
                        </details>

                        <div v-if="loginRequiredUrl && loginRequiredUrl === url.trim()" class="callout callout-warn" style="width:100%" role="alert">
                            <svg class="ico"><use href="#i-warn"></use></svg>
                            <div>
                                <p>來源可能需要登入。請依教學匯入 cookies.txt，再按解析重試。</p>
                                <div class="callout-actions"><button @click="openSites" class="btn btn-sm btn-primary">查看教學並匯入 cookies.txt</button></div>
                            </div>
                        </div>
                    </section>

                    <!-- Parse result -->
                    <transition name="result">
                        <section v-if="parseResult" class="result">
                            <p v-if="sourceChanged" class="callout callout-warn" style="margin-bottom:14px"><svg class="ico"><use href="#i-warn"></use></svg><span>來源已變更，請重新解析後再下載。</span></p>
                            <p v-if="parseResult.warning" class="callout callout-warn" style="margin-bottom:14px"><svg class="ico"><use href="#i-warn"></use></svg><span>{{ parseResult.warning }}</span></p>

                            <!-- Playlist -->
                            <template v-if="parseResult.is_playlist">
                                <div class="media-head">
                                    <div class="tile"><svg class="ico"><use href="#i-playlist"></use></svg></div>
                                    <div style="min-width:0">
                                        <h2 class="media-title" :title="parseResult.title">{{ parseResult.title }}</h2>
                                        <p class="media-sub">播放清單 · 共 {{ parseResult.item_count }} 首</p>
                                    </div>
                                </div>

                                <div class="group flat has-menu">
                                    <label class="row row-tap check-row">
                                        <span class="row-title">全選</span>
                                        <span style="display:inline-flex"><input type="checkbox" v-model="selectAll" class="sr-only"><span class="check"><svg class="ico"><use href="#i-check"></use></svg></span></span>
                                    </label>
                                    <div class="row row-tap" @click="toggleBatchDropdown" role="button" tabindex="0" @keyup.enter="toggleBatchDropdown" aria-haspopup="menu" :aria-expanded="isBatchDropdownOpen">
                                        <span class="row-title">下載內容</span>
                                        <span class="menu-anchor">
                                            <span class="row-value" style="color:var(--accent);display:inline-flex;align-items:center;gap:4px">{{ batchDownloadFormat === 'video' ? '自動最佳畫質' : '純音訊' }}<svg class="ico" style="width:14px;height:14px"><use href="#i-updown"></use></svg></span>
                                            <transition name="menu">
                                                <ul v-if="isBatchDropdownOpen" class="menu" role="menu" @click.stop>
                                                    <li role="menuitem" tabindex="0" @click="selectBatchFormat('video')" @keyup.enter="selectBatchFormat('video')" :class="{ selected: batchDownloadFormat === 'video' }"><span>自動最佳畫質</span><svg v-if="batchDownloadFormat === 'video'" class="ico"><use href="#i-check"></use></svg></li>
                                                    <li role="menuitem" tabindex="0" @click="selectBatchFormat('audio')" @keyup.enter="selectBatchFormat('audio')" :class="{ selected: batchDownloadFormat === 'audio' }"><span>純音訊</span><svg v-if="batchDownloadFormat === 'audio'" class="ico"><use href="#i-check"></use></svg></li>
                                                </ul>
                                            </transition>
                                        </span>
                                    </div>
                                </div>

                                <div class="entries">
                                    <label v-for="(item, index) in parseResult.entries" :key="index" class="entry" :class="{ on: item.selected }">
                                        <input type="checkbox" v-model="item.selected" class="sr-only"><span class="check"><svg class="ico"><use href="#i-check"></use></svg></span>
                                        <span class="num tnum">{{ index + 1 }}</span>
                                        <span class="t truncate">{{ item.title }}</span>
                                    </label>
                                </div>

                                <button @click="startBatchDownload" :disabled="sourceChanged || selectedCount === 0" class="btn btn-primary btn-block" style="margin-top:20px;height:52px">
                                    <svg class="ico"><use href="#i-download"></use></svg>下載選取的 {{ selectedCount }} 首歌曲
                                </button>
                            </template>

                            <!-- Single item -->
                            <template v-else>
                                <div class="media-head">
                                    <div class="tile"><svg class="ico"><use :href="parseResult.has_video ? '#i-video' : '#i-music'"></use></svg></div>
                                    <h2 class="media-title" :title="parseResult.title">{{ parseResult.title }}</h2>
                                </div>

                                <div class="group flat has-menu">
                                    <div class="row row-tap" @click="toggleFormatDropdown" role="button" tabindex="0" @keyup.enter="toggleFormatDropdown" aria-haspopup="menu" :aria-expanded="isFormatDropdownOpen">
                                        <span class="row-title">下載格式</span>
                                        <span class="menu-anchor" style="min-width:0">
                                            <span class="row-value truncate" style="color:var(--accent);display:inline-flex;align-items:center;gap:4px;max-width:100%"><span class="truncate">{{ getFormatText }}</span><svg class="ico" style="width:14px;height:14px"><use href="#i-updown"></use></svg></span>
                                            <transition name="menu">
                                                <ul v-if="isFormatDropdownOpen" class="menu" role="menu" @click.stop>
                                                    <li role="menuitem" tabindex="0" @click="selectFormat('audio_only')" @keyup.enter="selectFormat('audio_only')" :class="{ selected: selectedFormat === 'audio_only' }"><span>純音訊</span><svg v-if="selectedFormat === 'audio_only'" class="ico"><use href="#i-check"></use></svg></li>
                                                    <li v-if="parseResult.has_video" role="menuitem" tabindex="0" @click="selectFormat('best')" @keyup.enter="selectFormat('best')" :class="{ selected: selectedFormat === 'best' }"><span>自動最佳畫質</span><svg v-if="selectedFormat === 'best'" class="ico"><use href="#i-check"></use></svg></li>
                                                    <template v-if="parseResult.video_formats && parseResult.video_formats.length">
                                                        <hr>
                                                        <li class="menu-label">影片畫質</li>
                                                        <li v-for="fmt in parseResult.video_formats" :key="fmt.id" role="menuitem" tabindex="0" @click="selectFormat(fmt.id)" @keyup.enter="selectFormat(fmt.id)" :class="{ selected: selectedFormat === fmt.id }">
                                                            <span>{{ fmt.resolution }} · {{ fmt.ext }} · {{ fmt.id }}{{ fmt.fps ? ` · ${fmt.fps}fps` : '' }}</span>
                                                            <svg v-if="selectedFormat === fmt.id" class="ico"><use href="#i-check"></use></svg>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </transition>
                                        </span>
                                    </div>
                                </div>

                                <button @click="startDownload" :disabled="sourceChanged" class="btn btn-primary btn-block" style="margin-top:20px;height:52px">
                                    <svg class="ico"><use href="#i-download"></use></svg>加入下載佇列
                                </button>
                            </template>
                        </section>
                    </transition>

                </div>

                <!-- Tasks -->
                <section class="stack" style="margin-top:80px; gap:20px">
                    <div class="section-head">
                        <div>
                            <h2>下載任務<small class="tnum">{{ tasks.length }}</small></h2>
                            <p class="caption tnum" style="margin-top:4px">進行中 {{ activeDownloads }} / {{ config.max_concurrent_downloads }} · 排隊 {{ tasks.filter(t => t.state === 'QUEUED').length }}</p>
                        </div>
                        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                            <span v-if="!wsConnected" class="conn" role="status"><span class="dot"></span>連線中斷，正在重新連線</span>
                            <button @click="downloadAll" :disabled="completedCount === 0" class="btn btn-sm btn-tinted"><svg class="ico ico-sm"><use href="#i-archive"></use></svg>下載 ZIP（{{ completedCount }}）</button>
                        </div>
                    </div>

                    <div v-if="tasks.length === 0" class="empty">
                        <svg class="ico"><use href="#i-download"></use></svg>
                        <b>尚無下載任務</b>
                        <span>解析連結並加入佇列後，任務會顯示在這裡。</span>
                    </div>

                    <transition-group name="list" tag="div" class="tasks" :class="{ 'is-empty': tasks.length === 0 }">
                        <article v-for="task in reversedTasks" :key="task.task_id" class="task">
                            <div class="task-main">
                                <div class="state-ico" :class="'st-' + task.state">
                                    <svg v-if="task.state === 'COMPLETED'" :key="'c'" class="ico"><use href="#i-check"></use></svg>
                                    <svg v-else-if="task.state === 'ERROR'" :key="'e'" class="ico"><use href="#i-exclaim"></use></svg>
                                    <svg v-else-if="task.state === 'DOWNLOADING'" :key="'d'" class="ico"><use href="#i-arrow-up" style="transform-origin:center;transform:rotate(180deg)"></use></svg>
                                    <span v-else-if="task.state === 'PROCESSING'" :key="'p'" class="spinner"></span>
                                    <svg v-else :key="'q'" class="ico"><use href="#i-clock"></use></svg>
                                </div>
                                <div class="task-info">
                                    <h3 class="task-title truncate" :title="task.title">{{ task.title }}</h3>
                                    <div class="task-meta tnum">
                                        <span :class="'s-' + task.state">{{ getStatusText(task.state) }}<template v-if="task.state === 'DOWNLOADING'">&nbsp;{{ Math.floor(task.progress || 0) }}%</template></span>
                                        <span>{{ task.output_format === 'original' ? '原始容器' : (task.output_format || 'mp4').toUpperCase() }}</span>
                                        <span v-if="task.state === 'DOWNLOADING'">{{ task.speed || '計算中…' }}</span>
                                        <span v-if="task.state === 'DOWNLOADING'">剩餘 {{ task.eta || '--' }}</span>
                                    </div>
                                </div>
                                <div class="task-actions">
                                    <button v-if="task.state === 'COMPLETED'" @click="downloadFile(task)" title="下載至電腦" aria-label="下載至電腦" class="btn-icon is-accent"><svg class="ico"><use href="#i-download"></use></svg></button>
                                    <button v-if="task.state === 'ERROR'" @click="retryTask(task)" title="重試任務" aria-label="重試任務" class="btn-icon is-accent"><svg class="ico"><use href="#i-retry"></use></svg></button>
                                    <button :disabled="['DOWNLOADING', 'PROCESSING'].includes(task.state)" @click="deleteTask(task.task_id)" title="刪除任務" aria-label="刪除任務" class="btn-icon"><svg class="ico"><use href="#i-trash"></use></svg></button>
                                </div>
                            </div>

                            <div v-if="['QUEUED', 'DOWNLOADING', 'PROCESSING'].includes(task.state)" class="bar" role="progressbar" :aria-valuenow="Math.floor(task.progress || 0)" aria-valuemin="0" aria-valuemax="100">
                                <div class="bar-fill" :class="getProgressBarClass(task.state)" :style="{ width: (task.state === 'PROCESSING' ? 100 : (task.progress || 0)) + '%' }"></div>
                            </div>

                            <div v-if="task.state === 'ERROR'" class="task-error">
                                {{ task.error_msg }}
                                <template v-if="task.login_required">
                                    <div><button @click="openSites" class="btn btn-sm btn-tinted">查看教學並匯入 cookies.txt</button></div>
                                    <p class="hint">匯入後，按此任務的「重試」按鈕。</p>
                                </template>
                            </div>
                        </article>
                    </transition-group>
                </section>
            </main>

            <!-- Settings -->
            <transition name="sheet">
                <div v-if="showSettings && isAdmin" class="overlay" @click.self="showSettings = false">
                    <div class="sheet" role="dialog" aria-modal="true" aria-label="系統設定">
                        <div class="sheet-head">
                            <h2>系統設定</h2>
                            <button aria-label="關閉設定" @click="showSettings = false" class="btn-icon"><svg class="ico ico-sm"><use href="#i-x"></use></svg></button>
                        </div>

                        <div class="sheet-body">
                            <section class="sheet-section">
                                <h3>下載</h3>
                                <div class="group group-surface">
                                    <label class="row"><span class="row-title">最大同時下載數</span>
                                        <input aria-label="最大同時下載數" v-model.number="tempConfig.max_concurrent_downloads" type="number" min="1" max="10" class="row-input tnum" style="color:var(--accent)">
                                    </label>
                                    <label class="row"><span class="row-title">每部影片的分段連線數</span>
                                        <input aria-label="每部影片的分段連線數" v-model.number="tempConfig.concurrent_fragments" type="number" min="1" max="16" class="row-input tnum" style="color:var(--accent)">
                                    </label>
                                </div>
                                <p class="caption">同時下載數控制影片數量；分段連線數控制單部影片的串流下載（HLS／DASH）。</p>
                            </section>

                            <section v-if="currentUser?.id === 'bootstrap-admin'" class="sheet-section">
                                <h3>
                                    <span>Cookie 管理</span>
                                    <span class="badge" :class="cookieStatus ? 'badge-green' : 'badge-orange'">檔案：{{ cookieStatus ? '已上傳' : '未提供' }}</span>
                                </h3>
                                <div class="group group-surface">
                                    <div class="row"><span class="row-title">Cookies 來源</span>
                                        <button type="button" class="select-btn" @click="toggleSelect('sel:cookie-source', $event)" aria-haspopup="menu" :aria-expanded="openChip === 'sel:cookie-source'">
                                            <span>{{ cookieSourceLabels[tempConfig.cookie_source] }}</span><svg class="ico"><use href="#i-updown"></use></svg>
                                        </button>
                                        <transition name="menu">
                                            <ul v-if="openChip === 'sel:cookie-source'" class="menu menu-fixed" role="menu" :style="selectStyle" @click.stop>
                                                <li v-for="(label, key) in cookieSourceLabels" :key="key" role="menuitem" tabindex="0" @click="tempConfig.cookie_source = key; closeDropdowns()" @keyup.enter="tempConfig.cookie_source = key; closeDropdowns()" :class="{ selected: tempConfig.cookie_source === key }"><span>{{ label }}</span><svg v-if="tempConfig.cookie_source === key" class="ico"><use href="#i-check"></use></svg></li>
                                            </ul>
                                        </transition>
                                    </div>
                                    <template v-if="tempConfig.cookie_source === 'browser'">
                                        <div class="row"><span class="row-title">瀏覽器</span>
                                        <button type="button" class="select-btn" @click="toggleSelect('sel:cookie-browser', $event)" aria-haspopup="menu" :aria-expanded="openChip === 'sel:cookie-browser'">
                                            <span>{{ tempConfig.cookie_browser }}</span><svg class="ico"><use href="#i-updown"></use></svg>
                                        </button>
                                        <transition name="menu">
                                            <ul v-if="openChip === 'sel:cookie-browser'" class="menu menu-fixed" role="menu" :style="selectStyle" @click.stop>
                                                <li v-for="name in cookieBrowsers" :key="name" role="menuitem" tabindex="0" @click="tempConfig.cookie_browser = name; closeDropdowns()" @keyup.enter="tempConfig.cookie_browser = name; closeDropdowns()" :class="{ selected: tempConfig.cookie_browser === name }"><span>{{ name }}</span><svg v-if="tempConfig.cookie_browser === name" class="ico"><use href="#i-check"></use></svg></li>
                                            </ul>
                                        </transition>
                                    </div>
                                        <label class="row"><span class="row-title">設定檔</span>
                                            <input v-model="tempConfig.cookie_profile" placeholder="留空使用預設" class="row-input" aria-label="設定檔名稱或路徑">
                                        </label>
                                    </template>
                                </div>
                                <p class="caption">此為系統管理者的舊版伺服器來源；個人 cookies 優先使用，只供自己的帳號解析與下載。目前使用：{{ systemStatus.source === 'browser' ? systemStatus.browser : systemStatus.source === 'none' ? '停用' : '上傳檔案' }}。變更來源需儲存設定。</p>
                                <div class="actions-inline" style="padding:12px 16px 0">
                                    <button @click="openSites" class="btn btn-sm btn-tinted">cookies.txt 使用教學與匯入</button>
                                    <button @click="testCookies" class="btn btn-sm btn-gray">測試已儲存的來源</button>
                                    <button v-if="cookieStatus" @click="deleteCookies" class="btn btn-sm btn-danger">刪除上傳檔案</button>
                                </div>
                                <transition name="result">
                                    <p v-if="cookieMsg" class="callout" :class="cookieMsgSuccess ? '' : 'callout-error'" :style="cookieMsgSuccess ? 'background:var(--tint-green);color:var(--green);margin-top:12px' : 'margin-top:12px'">{{ cookieMsg }}</p>
                                </transition>
                            </section>

                            <section class="sheet-section">
                                <h3>系統狀態</h3>
                                <div class="group group-surface">
                                    <div class="row"><span class="row-title">FFmpeg／ffprobe</span><span class="row-value" :style="{ color: systemStatus.ffmpeg_available ? 'var(--green)' : 'var(--red)' }">{{ systemStatus.ffmpeg_available ? '可使用' : '缺少，請安裝後重啟' }}</span></div>
                                    <div class="row"><span class="row-title">SSO</span><span class="row-value">{{ systemStatus.sso_enabled ? '已設定' : '尚未設定' }}</span></div>
                                    <div class="row"><span class="row-title">yt-dlp</span><span class="row-value tnum">{{ ytdlpVersion }}</span></div>
                                </div>
                                <p class="caption">SSO 負責登入此工具；尚未設定時請由部署環境設定 OIDC。影片網站的登入狀態透過上方 cookies 來源提供。</p>
                            </section>

                            <section class="sheet-section">
                                <h3>系統維護</h3>
                                <button @click="updateYtDlp" :disabled="isUpdating" class="btn btn-gray btn-block">
                                    <span v-if="isUpdating" class="spinner"></span><svg v-else class="ico"><use href="#i-retry"></use></svg>
                                    {{ isUpdating ? '更新中…請稍候' : '一鍵更新 yt-dlp' }}
                                </button>
                                <transition name="result">
                                    <p v-if="updateMsg" class="callout" :class="updateSuccess ? '' : 'callout-error'" :style="updateSuccess ? 'background:var(--tint-green);color:var(--green);margin-top:12px' : 'margin-top:12px'">{{ updateMsg }}</p>
                                </transition>
                            </section>
                        </div>

                        <div class="sheet-foot">
                            <button @click="showSettings = false" class="btn btn-gray">取消</button>
                            <button @click="saveSettings" class="btn btn-primary">儲存設定</button>
                        </div>
                    </div>
                </div>
            </transition>

            <!-- User management -->
            <transition name="sheet">
                <div v-if="showUserManagement && isAdmin" class="overlay" @click.self="showUserManagement = false">
                    <div class="sheet sheet-lg" role="dialog" aria-modal="true" aria-label="使用者管理">
                        <div class="sheet-head">
                            <h2>使用者管理</h2>
                            <button @click="showUserManagement = false" aria-label="關閉使用者管理" class="btn-icon"><svg class="ico ico-sm"><use href="#i-x"></use></svg></button>
                        </div>
                        <div class="sheet-body">
                            <section class="sheet-section">
                                <h3>每日下載規則</h3>
                                <div class="group group-surface">
                                    <label class="row"><span class="row-title">一般使用者預設每日上限</span>
                                        <input v-model.number="userPolicy.default_daily_limit" aria-label="一般使用者預設每日上限" type="number" min="0" max="10000" class="row-input tnum" style="color:var(--accent)">
                                    </label>
                                </div>
                                <p class="caption">管理者不限部數。個人可覆寫預設值；0 代表不允許新增下載。額度按成功完成的影片計算，排隊先預留、失敗歸還，每天台灣時間 00:00 重置。</p>
                                <div style="padding:12px 16px 0"><button @click="savePolicy" :disabled="userBusy" class="btn btn-sm btn-primary">儲存預設上限</button></div>
                            </section>

                            <form @submit.prevent="createUser" class="sheet-section">
                                <h3>新增使用者</h3>
                                <div class="user-card">
                                    <div class="form-grid">
                                        <label class="field"><span>新帳號</span><input v-model="newUser.username" required minlength="3" maxlength="64" autocomplete="off" class="input" placeholder="英文、數字、. _ @ -"></label>
                                        <label class="field"><span>顯示名稱</span><input v-model="newUser.name" required maxlength="80" class="input"></label>
                                        <label class="field"><span>初始密碼</span><input v-model="newUser.password" type="password" required minlength="10" maxlength="256" autocomplete="new-password" class="input" placeholder="至少 10 個字元"></label>
                                        <div class="field"><span>角色</span>
                                                <button type="button" class="input select-field" @click="toggleSelect('sel:role-new', $event)" aria-haspopup="menu" :aria-expanded="openChip === 'sel:role-new'">
                                                    <span>{{ roleLabels[newUser.role] }}</span><svg class="ico"><use href="#i-updown"></use></svg>
                                                </button>
                                                <transition name="menu">
                                            <ul v-if="openChip === 'sel:role-new'" class="menu menu-fixed" role="menu" :style="selectStyle" @click.stop>
                                                <li v-for="(label, key) in roleLabels" :key="key" role="menuitem" tabindex="0" @click="newUser.role = key; closeDropdowns()" @keyup.enter="newUser.role = key; closeDropdowns()" :class="{ selected: newUser.role === key }"><span>{{ label }}</span><svg v-if="newUser.role === key" class="ico"><use href="#i-check"></use></svg></li>
                                            </ul>
                                        </transition>
                                            </div>
                                    </div>
                                    <div v-if="newUser.role === 'user'" class="group">
                                        <label class="row row-tap"><span class="row-title">使用全體預設每日上限</span><input type="checkbox" v-model="newUser.inherit" class="switch"></label>
                                        <label v-if="!newUser.inherit" class="row"><span class="row-title">個人每日上限</span><input v-model.number="newUser.daily_limit" type="number" min="0" max="10000" class="row-input tnum" style="color:var(--accent)"></label>
                                    </div>
                                    <div><button type="submit" :disabled="userBusy" class="btn btn-sm btn-primary">新增帳號</button></div>
                                </div>
                            </form>

                            <section class="sheet-section">
                                <h3>帳號與個別設定</h3>
                                <div style="display:flex;flex-direction:column;gap:12px">
                                    <div v-for="user in managedUsers" :key="user.id" :data-user-id="user.id" class="user-card">
                                        <div class="user-card-head">
                                            <span style="font-weight:600;word-break:break-all">{{ user.username }} <span class="badge" style="margin-left:6px">{{ user.oidc_sub ? 'SSO' : user.id === 'bootstrap-admin' ? '系統管理者' : '本機帳號' }}</span></span>
                                            <span class="caption tnum">今日完成 {{ user.quota.used }} · 預留 {{ user.quota.reserved }} · {{ user.quota.limit === null ? '不限' : `上限 ${user.quota.limit}` }}</span>
                                        </div>
                                        <div class="form-grid">
                                            <label class="field"><span>名稱</span><input v-model="user.name" class="input"></label>
                                            <div class="field"><span>角色</span>
                                                <button type="button" class="input select-field" @click="toggleSelect('sel:role-' + user.id, $event)" :disabled="user.id === 'bootstrap-admin'" aria-haspopup="menu" :aria-expanded="openChip === 'sel:role-' + user.id">
                                                    <span>{{ roleLabels[user.role] }}</span><svg class="ico"><use href="#i-updown"></use></svg>
                                                </button>
                                                <transition name="menu">
                                            <ul v-if="openChip === 'sel:role-' + user.id" class="menu menu-fixed" role="menu" :style="selectStyle" @click.stop>
                                                <li v-for="(label, key) in roleLabels" :key="key" role="menuitem" tabindex="0" @click="user.role = key; closeDropdowns()" @keyup.enter="user.role = key; closeDropdowns()" :class="{ selected: user.role === key }"><span>{{ label }}</span><svg v-if="user.role === key" class="ico"><use href="#i-check"></use></svg></li>
                                            </ul>
                                        </transition>
                                            </div>
                                            <label v-if="!user.oidc_sub" class="field"><span>重設密碼</span><input v-model="user.newPassword" type="password" minlength="10" autocomplete="new-password" placeholder="留空保留密碼" class="input"></label>
                                        </div>
                                        <div class="group">
                                            <template v-if="user.role === 'user'">
                                                <label class="row row-tap"><span class="row-title">使用全體預設每日上限</span><input type="checkbox" v-model="user.inherit" class="switch"></label>
                                                <label v-if="!user.inherit" class="row"><span class="row-title">個人每日上限</span><input v-model.number="user.limitInput" type="number" min="0" max="10000" class="row-input tnum" style="color:var(--accent)"></label>
                                            </template>
                                            <label class="row row-tap"><span class="row-title">停用此帳號</span><input type="checkbox" v-model="user.disabled" :disabled="user.id === 'bootstrap-admin'" class="switch"></label>
                                        </div>
                                        <div style="display:flex;justify-content:flex-end"><button @click="saveUser(user)" :disabled="userBusy" class="btn btn-sm btn-primary">儲存使用者</button></div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            </transition>

            <!-- Cookies -->
            <transition name="sheet">
                <div v-if="showSites" class="overlay" @click.self="showSites = false">
                    <div class="sheet" role="dialog" aria-modal="true" aria-label="Cookies 設定">
                        <div class="sheet-head">
                            <h2>Cookies 設定</h2>
                            <button @click="showSites = false" aria-label="關閉 Cookies 設定" class="btn-icon"><svg class="ico ico-sm"><use href="#i-x"></use></svg></button>
                        </div>
                        <div class="sheet-body">
                            <p class="caption" style="padding:0 4px;font-size:14px">影片需要登入才能觀看時，先在自己的電腦登入網站，再匯入 cookies.txt。匯入資料只供你的帳號使用。</p>

                            <section aria-labelledby="cookie-guide-title" class="sheet-section">
                                <h3 id="cookie-guide-title">使用教學</h3>
                                <div class="group group-surface" style="padding:16px">
                                    <a href="https://chromewebstore.google.com/detail/get-cookiestxt-locally/cclelndahbckbenkjhflpdbgdldlbecc" target="_blank" rel="noopener noreferrer" class="link" style="font-size:15px;font-weight:500;word-break:break-word">安裝 Get cookies.txt LOCALLY<svg class="ico ico-sm" style="display:inline;vertical-align:-2px;margin-left:3px"><use href="#i-external"></use></svg></a>
                                    <ol style="margin:12px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.55;color:var(--label-2)">
                                        <li>在電腦的 Chrome 開啟上方連結，按「加到 Chrome」，安裝擴充套件。</li>
                                        <li>開啟要下載的網站（例如 YouTube），登入自己的帳號，確認影片可以播放。</li>
                                        <li>保持在該網站分頁，點 Chrome 右上角的擴充功能圖示，開啟 Get cookies.txt LOCALLY。將 Export Format 設為 <strong style="color:var(--label)">Netscape</strong>，按 <strong style="color:var(--label)">Export</strong> 或 Export As，儲存 .txt 檔案。</li>
                                        <li>回到這裡選取檔案，按「匯入個人 cookies」。成功後關閉此視窗，重新按「解析網址」，或在失敗任務按「重試」。</li>
                                    </ol>
                                    <p class="caption" style="margin-top:12px">只需匯出要下載網站的 cookies；請選 Netscape 格式，檔案上限 2 MB。登入失效時，重新登入網站、匯出並匯入即可。</p>
                                </div>
                            </section>

                            <section class="sheet-section">
                                <h3>匯入 cookies.txt</h3>
                                <div class="group group-surface" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
                                    <input type="file" accept=".txt" ref="cookieFileInput" @change="handleCookieFileChange" aria-label="個人 cookies 檔案">
                                    <div><button @click="uploadCookie" :disabled="isUploadingCookie || !cookieFile" class="btn btn-sm btn-primary"><span v-if="isUploadingCookie" class="spinner"></span>{{ isUploadingCookie ? '匯入中…' : '匯入個人 cookies' }}</button></div>
                                    <p v-if="cookieMsg" role="status" class="caption" style="font-size:14px;word-break:break-word" :style="{ color: cookieMsgSuccess ? 'var(--green)' : 'var(--red)' }">{{ cookieMsg }}</p>
                                </div>
                                <p class="caption">新檔案會取代上一份個人匯入檔案。cookies 包含登入憑證，請妥善保管並只上傳至你信任的下載工具。</p>
                            </section>

                            <section class="sheet-section">
                                <h3>已儲存的 cookies</h3>
                                <div v-if="siteAccounts.length" class="group group-surface">
                                    <div v-for="site in siteAccounts" :key="site.site_key" class="row">
                                        <span style="min-width:0;word-break:break-all">{{ site.name }}<span class="row-sub">僅供自己的帳號使用</span></span>
                                        <button @click="forgetSite(site)" class="btn btn-sm btn-danger">移除</button>
                                    </div>
                                </div>
                                <p v-else class="caption" style="padding:0 16px;font-size:14px">尚未匯入個人 cookies。</p>
                            </section>
                        </div>
                    </div>
                </div>
            </transition>
        </template>

        <!-- Confirm alert -->
        <transition name="alert">
            <div v-if="confirmModal.show" class="overlay overlay-top overlay-center" style="align-items:center;padding:20px" @click.self="confirmModal.show = false">
                <div class="sheet alert" role="alertdialog" aria-modal="true" aria-label="確認刪除">
                    <div class="alert-body">
                        <div class="alert-icon"><svg class="ico"><use href="#i-trash"></use></svg></div>
                        <h3>確認刪除？</h3>
                        <p>{{ confirmModal.message }}</p>
                    </div>
                    <div class="alert-actions">
                        <button @click="handleConfirm" class="btn btn-destructive btn-block">確定刪除</button>
                        <button @click="confirmModal.show = false" class="btn btn-gray btn-block">取消</button>
                    </div>
                </div>
            </div>
        </transition>

        <!-- Restarting -->
        <transition name="alert">
            <div v-if="isRestarting" class="overlay overlay-top overlay-center" style="align-items:center;padding:20px;z-index:300">
                <div class="sheet alert" role="alertdialog" aria-modal="true" aria-label="系統重啟中" style="width:320px">
                    <div class="alert-body" style="padding:28px 24px 22px">
                        <span class="spinner spinner-lg" style="color:var(--accent)"></span>
                        <h3 style="margin-top:16px">系統重啟中</h3>
                        <p>yt-dlp 更新完畢，後端正在重新載入。</p>
                        <div class="restart-count tnum">{{ restartCountdown }}</div>
                        <p>秒後自動重新整理</p>
                    </div>
                    <div class="alert-actions"><button @click="forceReload" class="btn btn-gray btn-block">立刻重新整理</button></div>
                </div>
            </div>
        </transition>

    </div>

    <script src="app.js?v=20261026"></script>
    <script>
        // Hairline under the nav only once content actually scrolls beneath it.
        (function () {
            var root = document.documentElement, on = false;
            function sync() {
                var next = window.scrollY > 4;
                if (next !== on) { on = next; root.toggleAttribute('data-scrolled', on); }
            }
            window.addEventListener('scroll', sync, { passive: true });
            sync();
        })();
    </script>
</body>
</html>
