services:
  video-downloader:
    image: ${DOWNLOADER_IMAGE:-ghcr.io/asdfgh282812/yt_dl_web:latest}
    container_name: video-downloader
    restart: unless-stopped
    ports:
      - "1280:8000"
    env_file: .env
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?請先在 .env 設定 AUTH_TOKEN}
    volumes:
      - ./config:/app/config
      - ./temp:/app/temp
