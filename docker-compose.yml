version: '3.8'

services:
  video-downloader:
    build: .
    container_name: video-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PUID=1000
      - PGID=1000
      - AUTH_TOKEN=your_secure_password_here
    volumes:
      - ./frontend:/app/frontend
      - ./temp:/app/temp
      - ./config:/app/config
      - ./main.py:/app/main.py
